      cn: 隔离特定区域或主体的集中光束，在画面中创造自然的视觉焦点，周围的黑暗退去强调被照亮的主题，戏剧性聚光灯效果以不可否认的力量吸引目光，明暗之间的锐利过渡创造图形冲击力，用于戏剧性出场、重要揭示或营造被观察的感觉，最直接的基于照明的叙事形式，强大而不含糊的视觉指引
    轮廓光:
