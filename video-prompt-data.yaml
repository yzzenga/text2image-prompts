      cn: 1940年代中国战场，破败的村庄土墙前，抗战胜利的瞬间被冻结，英雄身穿褪色灰布军装腰间别着缴获的日军军刀刚刚将手中步枪高高举过头顶张嘴高呼的姿态被精准冻结脸上混合着血污泥土和滚烫泪水笑容如阳光般绽放，子弹时间运镜启动，相机以英雄为圆心沿弧线从地面低角度上升到俯角360度环绕，环绕过程中可见英雄身边十数名战友凝固在不同庆祝姿态有人拥抱跳跃双脚离地有人将帽子抛向空中军帽悬停在多个高度有人跪地掩面而泣肩膀耸动，一面被炮火打出弹孔的军旗在逆风中凝固飘扬旗面上的弹孔边缘呈焦黑卷曲，空气中悬浮着战场的硝烟尘土和被击碎的土墙碎块，一缕阳光透过硝烟云层形成丁达尔光柱光柱中可见悬浮的尘埃颗粒如金色星尘，英雄脚下散落着缴获的日军装备钢盔弹药箱一面太阳旗被踩在脚下，远处被炮火摧毁的碉堡废墟冒着凝固的青烟，一只归巢的麻雀被冻结在飞越战场的姿态翅膀完全展开，当相机环绕至英雄正面特写时可见他眼角皱纹干裂嘴唇帽檐下的汗水与泪痕，时间恢复英雄与战友拥抱军帽如雨落下硝烟散去阳光洒满战场远处传来号角声，8K史诗级画质，暖金色阳光与战场灰土对比色调，电影宽银幕2.35:1构图，厚重历史质感，英雄主义光影
  360全景运镜:
    隐形自拍杆运镜:
      en: Third-person perspective camera movement using 360-degree camera on an invisible selfie stick, the camera captures the full sphere around it and the software automatically removes the selfie stick from the frame, creating the illusion of a camera floating at a distance following the subject, the movement appears as if a drone or camera operator is following the subject from an impossible third-person perspective, the selfie stick extends 1-3 meters creating varying distance and angle from the subject, the operator holds the stick at different positions - overhead for bird's-eye POV, trailing behind for follow-cam effect, or extended forward for leading shot, the most distinctive movement vocabulary unique to 360 cameras, creates social media's most shareable and visually arresting perspective, requires careful framing awareness as the full sphere is being captured
      cn: 使用360度相机在隐形自拍杆上的第三人称视角摄影运动，相机捕捉周围完整球面，软件自动从画面中移除自拍杆，创造相机在远处漂浮跟随主体的幻觉，运动看起来像无人机或摄影师从不可能的第三人称视角跟随主体，自拍杆延伸1-3米创造与主体的不同距离和角度，操作者在不同位置持杆——头顶获得鸟瞰POV、拖后在后面获得跟随效果、或前置获得引导镜头，360相机独有的最具特色运动词汇，创造社交媒体上最具分享性和视觉冲击力的视角，需要谨慎的画框意识因为完整球面都在被捕捉
    小行星环绕:
      en: Tiny planet or asteroid orbital effect using 360-degree reframing in post-production, the 360 camera footage is mapped to a spherical projection that creates a miniature planet effect with the ground curving away beneath the subject, the camera orbits the nadir point creating the illusion of the subject standing on a small planet, moving the reframe center point creates a dynamic orbiting effect around the subject, the small planet can grow and shrink by adjusting the field of view within the reframe, combining physical camera movement with post-production reframe animation creates complex multi-axis 360 movement impossible with traditional cameras, the tiny planet perspective is the signature visual effect of 360-degree cinematography, instantly recognizable and highly engaging for social media audiences
      cn: 使用后期360度重新取景的小行星轨道效果，360相机素材映射到球面投影创造微型行星效果，地面在主体下方弯曲远去，相机绕天底点轨道运行创造主体站在小行星上的幻觉，移动重新取景中心点创造围绕主体的动态轨道效果，通过调整重取景中的视野角度使小行星变大或缩小，将物理相机运动与后期重取景动画相结合创造传统相机不可能实现的复杂多轴360运动，小行星视角是360度摄影的标志性视觉特效，对社交媒体观众即时可识别且高度吸引
    360穿梭运镜:
      en: Dynamic 360-degree camera movement through sequences of spaces with the camera mounted on a selfie stick or handler, the camera moves through doorways, around corners, and between environments capturing the full spherical environment, the footage is later reframed in post-production to create a traditional-looking perspective that follows the action, the viewer can also freely explore the full sphere by dragging on screen, the reframe can be animated to follow subjects, reveal elements, or create dramatic shifts in perspective, the unique value of 360 movement is capturing everything and deciding the final framing afterward, professional 360 cinematography requires thinking in full sphere while composing for the primary reframe direction, creates footage that works both as traditional linear video and interactive 360 experience
      cn: 使用安装在自拍杆或手柄上的360相机在空间序列中穿行的动态360度摄影运动，相机穿过门道、转过街角、在不同环境间穿梭捕捉完整球面环境，素材后期重新取景创造跟随动作的传统视角，观众也可通过拖拽屏幕自由探索完整球面，重取景可动画化以跟随主体、揭示元素或创造视角的戏剧性变化，360运动的独特价值在于捕捉一切然后决定最终构图，专业360摄影需要以完整球面思考同时为主要的重取景方向构图，创造既可作为传统线性视频也可作为交互式360体验的素材
  AI智能跟随:
    人物锁定跟随:
      en: AI-powered subject tracking and framing during camera movement, the camera or gimbal automatically locks onto and follows a selected subject maintaining consistent framing without manual adjustment, the AI tracking system uses computer vision to recognize and follow subjects even during occlusion, rapid movement, or changes in lighting, the camera movement is freed from the need to manually keep the subject framed allowing the operator to focus on creative movement paths, the tracking holds the subject at a specified position within the frame - center, rule of thirds, or custom position, modern AI tracking works with face detection, body shape recognition, or object tracking for different subject types, DJI ActiveTrack, Skydio autonomy, and Insta360 tracking represent the current state of the art, AI-assisted camera movement dramatically expands creative possibilities for solo operators and small crews
      cn: 摄影机运动中基于AI的主体跟踪和构图，相机或稳定器自动锁定并跟随选定的主体保持一致的构图无需手动调整，AI跟踪系统使用计算机视觉在遮挡、快速移动或光线变化期间识别并跟随主体，摄影机运动不再需要手动保持主体取景，允许操作者专注于创意运动路径，跟踪将主体保持在画面内的指定位置——居中、三分法或自定义位置，现代AI跟踪使用人脸检测、身形识别或物体跟踪适应不同类型的主体，DJI ActiveTrack、Skydio自主飞行和Insta360跟踪代表了当前技术的最高水平，AI辅助摄影运动为单人操作和小团队创作极大拓展了创意可能性
    自动环绕跟踪:
      en: AI-automated orbit camera movement where the tracking system controls the camera position to maintain a precise orbit around the subject, the operator or drone maintains distance while the AI keeps the subject perfectly framed at the center of the orbit, the orbit radius, height, and speed can be adjusted remotely allowing dynamic changes in the orbital path without interrupting the shot, the system automatically adjusts for subject movement keeping the orbital relationship consistent, the autonomous orbit creates professional-grade cinematic movement requiring only a tap on a screen to initiate, AI orbit technology enables complex camera movement patterns that would require a skilled camera operator with years of experience to execute manually, DJI's ActiveTrack Point of Interest and Skydio's KeyFrame automation are leading implementations
      cn: AI自动化的轨道环绕摄影运动，跟踪系统控制摄影机位置以保持围绕主体的精确轨道，操作者或无人机保持距离而AI将主体完美居中于轨道中心，轨道半径、高度和速度可远程调整，允许在运动中动态改变轨道路径而无需中断拍摄，系统自动适应主体移动保持轨道关系的一致，自主轨道创造专业级电影运动只需点击屏幕即可启动，AI轨道技术使需要数年经验的专业摄影操作员才能手动执行的复杂运动模式成为可能，DJI ActiveTrack兴趣点和Skydio KeyFrame自动化是领先的实现
    自动跟拍运镜:
      en: AI-driven follow camera movement where the system maintains consistent distance and framing while following a moving subject through complex environments, the autonomous follower navigates around obstacles, maintains line of sight, and adjusts path in real-time to keep the subject optimally framed, the ground-based or aerial follower predicts the subject's movement trajectory to stay ahead of path changes, the AI system learns the subject's appearance for reliable tracking across different lighting conditions and backgrounds, follow modes include tracking from behind (classic chase cam), from the side (parallel tracking), from ahead (leading shot), and from above (overhead follow), the operator sets the desired composition and distance while the AI handles all navigation and framing adjustments, autonomous follow technology puts professional tracking shots into the hands of solo creators
      cn: AI驱动的跟拍摄影运动，系统在复杂环境中跟随移动主体时保持稳定的距离和构图，自主跟随器导航绕过障碍物、保持视线、实时调整路径以保持主体的最佳构图，地面或空中跟随器预测主体的运动轨迹以提前应对路径变化，AI系统学习主体的外观以在不同照明条件和背景中可靠跟踪，跟随模式包括从后方跟踪（经典追逐视角）、从侧面（平行跟踪）、从前方（引导镜头）和从上方（头顶跟随），操作者设置期望的构图和距离而AI处理所有导航和取景调整，自主跟随技术将专业跟拍镜头交到单人创作者手中
