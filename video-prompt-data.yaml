      cn: 对灯光位置、强度和质量完全可控的专业工作室照明，包括主光、补光和背光的多光源用于主体的三维塑形，柔光箱和柔光板创造讨喜的柔光，格栅和遮光板允许精确的光线塑形，用光线雕琢主体的能力是专业电影摄影的标志，每个阴影都有意放置，每个高光都为构图服务
    霓虹灯光:
      en: Vibrant neon light sources creating atmospheric colored illumination, the distinctive glow of gas-filled tubes producing pure saturated colors, neon signage providing both practical lighting and visual interest in urban night scenes, the colored light bathes subjects and environments in cinematic color, reflections on wet surfaces multiply the visual impact, the aesthetic strongly associated with cyberpunk, noir, and urban nightlife cinematography, creates mood and atmosphere through color alone
      cn: 充满活力的霓虹光源营造氛围彩色照明，充气管的独特辉光产生纯净饱和的色彩，霓虹招牌在城市夜景中既提供实用照明又增加视觉趣味，彩色光线将主体和环境浸入电影色彩中，湿表面上的反射倍增视觉冲击，与赛博朋克、黑色电影和城市夜生活摄影紧密关联的美学，仅通过色彩就创造情绪和氛围
    热幕灯光:
