      cn: 放置于主体后方的背光沿边缘创造明亮的轮廓光带，以发光轮廓将主体与背景分离，该技术为画面增加深度和三维感，轮廓光捕捉头发、肩膀和侧影创造美丽的光晕效果，晨光或夕阳光用作自然轮廓光，瞬间提升制作价值的专业背光技术，创造迷人和空灵的质感
  特殊光影:
    体积光:
      en: Visible light beams created by light passing through atmospheric particles like dust, fog, or smoke, the volumetric light rays create tangible atmospheric depth and beautiful cinematic texture, god rays (crepuscular rays) streaming through windows or tree canopies add spiritual quality, the light becomes a visible three-dimensional element within the scene, requires carefully controlled atmospheric conditions to reveal the light beams, the most magical and atmospheric lighting effect in cinematography, transforms ordinary light into something physical and ethereal
      cn: 光线穿过尘埃、雾气或烟雾等大气粒子时产生的可见光束，体积光光线创造有形的氛围深度和美丽的电影质感，透过窗户或树冠射入的神圣光束增添灵性品质，光线成为场景中可见的三维元素，需要精心控制的大气条件才能显现光束，电影摄影中最神奇和氛围化的照明效果，将普通光线转化为有形的空灵之物
    光束:
      en: Concentrated shafts of light cutting through darkness creating dramatic pools of illumination, searchlights, car headlights, or flashlights creating moving beams that reveal the scene in fragments, the contrast between illuminated areas and darkness creates dynamic visual rhythm, light beams can be motivated by practical sources or created artificially, each beam revealing only what it touches while leaving the rest to imagination, creates anticipation and mystery as the light moves, the interplay of light and shadow in its most elemental form
      cn: 穿透黑暗的集中光束创造戏剧性的照明区域，探照灯、车头灯或手电筒创造移动光束逐步揭示场景，照明区域与黑暗之间的对比创造动态视觉节奏，光束可由实用光源激发或人工创造，每束光只揭示其触及之物，其余留给想象，光线移动时创造期待和神秘感，最纯粹形式的光影交互
    投影光:
      en: Patterned light created by light passing through stencils, blinds, foliage, or water, casting intricate shadow patterns across subjects and surfaces, the dappled light effect adds visual interest and texture to otherwise flat surfaces, Venetian blind shadows creating film noir atmosphere, leaf shadows suggesting outdoor or greenhouse settings, moving water reflections creating dynamic ever-changing patterns, the patterns add a layer of visual complexity that enriches the composition, creative lighting design at its most artistic
      cn: 光线穿过模板、百叶窗、树叶或水面时产生的图案光，在主体和表面上投下复杂阴影图案，斑驳光线效果为原本平面的表面增加视觉趣味和纹理，百叶窗阴影创造黑色电影氛围，树叶阴影暗示户外或温室环境，移动的水面倒影创造动态变幻的图案，图案增加一层丰富构图的视觉复杂性，最具艺术性的创意灯光设计
  布光技巧:
    伦勃朗光:
      en: Classic Rembrandt lighting technique characterized by a distinctive triangular highlight on the shadow side of the face, the triangle of light beneath the eye creates dramatic depth and three-dimensional form, a single key light placed at a 45-degree angle above and to the side of the subject, the dark side of the face falls naturally into shadow creating mystery and dimension, the technique creates a timeless and painterly quality associated with the Dutch master, professional portrait lighting standard that flatters most face shapes, the most celebrated single-source portrait lighting in Western art history
      cn: 以阴影侧脸部的标志性三角高光为特征的经典伦勃朗布光技术，眼睛下方的小三角光创造戏剧性深度和三维形态，主光置于主体侧上方45度角位置，脸的暗面自然落入阴影创造神秘感和立体感，该技术创造与荷兰画派大师相关的时间永恒感和绘画质感，适合大多数脸型的专业人像布光标准，西方艺术史上最著名的单光源人像布光
    蝴蝶光:
      en: Butterfly loop lighting with the key light placed directly in front and above the subject, creating a distinctive butterfly-shaped shadow beneath the nose, the symmetrical lighting produces an even glamorous illumination that Hollywood has favored for nearly a century, smooth shadows falling directly below features create a flattering sculptural effect, the technique minimizes skin texture making it ideal for beauty and fashion cinematography, the shadow placement can be adjusted by varying the light height, classic Hollywood glamour lighting that creates idealized beautiful portraits, professional beauty lighting gold standard
      cn: 主光置于主体正前上方的蝴蝶环形布光，在鼻子下方创造标志性的蝴蝶形阴影，对称照明产生好莱坞近一个世纪偏爱的均匀迷人光照，特征正下方的平滑阴影创造讨喜的雕塑效果，该技术最小化皮肤纹理使其成为美妆和时尚摄影的理想选择，阴影位置可通过调节灯光高度调整，创造理想化美丽人像的经典好莱坞魅力布光，专业美妆布光黄金标准
    侧光:
      en: Split lighting where the key light illuminates one half of the face while the other half falls into deep shadow, the dramatic half-light half-shadow creates strong graphic impact and emotional intensity, the technique emphasizes facial structure and texture through extreme contrast, the split between light and dark creates visual tension and mystery, popular in film noir, thriller, and dramatic portrait cinematography, the dark side of the face suggests hidden depths and unspoken emotions, one of the most powerful and expressive single-source lighting techniques
      cn: 主光只照亮半张脸而另一半落入深邃阴影的分割布光，戏剧性的半明半暗创造强烈的图形冲击和情感强度，该技术通过极端对比强调面部结构和纹理，明暗之间的分割创造视觉张力和神秘感，在黑色电影、惊悚片和戏剧人像摄影中流行，脸的暗面暗示隐藏的深度和未言明的情感，最有力且富有表现力的单光源布光技术之一
    环形光:
      en: Loop lighting with the key light placed slightly above and to the side creating a small shadow loop from the nose onto the cheek, the subtle shadow creates gentle depth without the drama of more extreme lighting patterns, the most versatile and commonly used portrait lighting pattern, flattering to most face shapes while creating natural-looking dimension, the loop shadow should not extend to the mouth creating the more dramatic Rembrandt triangle, professional standard for beauty, corporate, and natural portrait photography, balances dimension with approachability
      cn: 主光略高于侧面在鼻侧到面颊创造小环形阴影的环形布光，微妙的阴影创造温和深度而不带来更极端布光的戏剧效果，最通用和常用的人像布光模式，适合大多数脸型同时创造自然的立体感，环形阴影不应延伸到嘴部（那将变成更戏剧性的伦勃朗三角），适用于美妆、商务和自然人像摄影的专业标准，平衡立体感与亲和力
