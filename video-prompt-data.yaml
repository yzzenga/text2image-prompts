      cn: 以电影运动呈现的经典日系动漫视觉风格，线条干净色彩饱满的独特赛璐璐着色，大眼睛富有表现力的精细角色设计和风格化比例，吉卜力灵感的手绘感丰富背景环境，动画风格通过视觉隐喻强调情感表达，鲜艳色彩和富有想象力的世界观构建，动态镜头移动下的流畅角色动画，定义全球动画传统的美学风格
