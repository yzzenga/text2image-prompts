    HDR电影:
      en: High Dynamic Range cinema-grade imagery with expanded luminance range, deep inky blacks coexisting with brilliant specular highlights, shadow detail preserved without crushing, highlight information retained without clipping, vibrant colors with extended gamut creating more lifelike and immersive images, professional HDR grading for Dolby Vision or HDR10 standards, the expanded dynamic range creates a more three-dimensional image with tangible depth, cinematic look with unprecedented visual impact and realism
      cn: 高动态范围影院级画面配合扩展的亮度范围，深邃墨黑与明亮镜面高光共存，暗部细节保留不丢失，高光信息完整不溢出，扩展色域的鲜艳色彩创造更逼真和沉浸的画面，针对杜比视界或HDR10标准的专业HDR调色，扩展的动态范围创造更具三维感的空间深度，前所未有的视觉冲击力和真实感的电影外观
  写实风格:
