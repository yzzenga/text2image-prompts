      cn: 应用于数字素材的电影胶片颗粒纹理，模拟传统摄影胶片的有机质感，微妙的颗粒结构为画面增添温暖、深度和怀旧特质，从柯达Tri-X到富士Velvia不同胶片类型各异的颗粒大小和强度，柔和纹理软化数字的冰冷锐度，创造更有机和情感共鸣的画面，增加真实性和时代特征的专业电影技术
    色调调色:
