      cn: 日落之后或日出之前的暮光时段，天空呈现深邃饱和的蓝色，环境光线冷冽均匀带有这个时间特有的魔法质感，城市灯光开始在深蓝天空下闪烁创造美丽的对比，蓝色时刻光线从天际柔和定向洒落，创造电影摄影师钟爱的情绪化电影氛围，冷蓝调唤起平静、神秘和过渡期的感觉，短暂的时间窗口需要谨慎规划和准备
