      cn: 使用色轮上相对颜色的醒目互补色对比，最常见和视觉冲击力最强的是青橙配，冷暖并置创造即时的视觉冲击和三维分离感，该技术仅通过色温差就使主体从背景中即刻突出，在现代好莱坞大片调色中占主导地位，对比色创造动态当代感的视觉张力和能量，专业互补色调是现代电影色彩理论的基石
