      cn: 台灯、串灯和蜡烛等暖色实用光源创造亲密舒适的氛围，2700K左右的暖色温在皮肤上产生讨喜的金色调，实用灯兼具光源和场景装饰的双重功能，小光源创造光池周围环绕深邃阴影，温暖辉光增强亲密浪漫氛围，常用于卧室、餐厅和夜场景电影摄影
  光线质感:
    柔和光线:
      en: Soft, diffused lighting that wraps around the subject creating gentle shadows with soft edges, achieved through large light sources close to the subject or diffusion materials scattering the light, the most flattering lighting for portraiture and beauty cinematography, the gradual transition between highlight and shadow creates a smooth dimensional rendering, skin textures appear smoother and more even, the soft quality conveys a gentle, romantic, or dreamy atmosphere, professional beauty lighting standard
      cn: 包裹主体的柔和漫射光创造边缘柔和的温和阴影，通过靠近主体的大型光源或漫射材料散射光线实现，人像和美妆摄影中最讨喜的照明，高光和阴影之间的渐变过渡创造平滑的立体渲染，皮肤纹理显得更平滑均匀，柔和质感传达温和、浪漫或梦幻氛围，专业美妆照明标准
    戏剧性灯光:
      en: High-contrast dramatic lighting with strong directional quality, deep inky shadows and bright specular highlights creating bold visual statements, single source lighting (chiaroscuro) emphasizing form through extreme light-to-shadow ratio, the technique creates mystery, tension, and emotional intensity, classic film noir and thriller lighting aesthetic, every shadow tells a story, the unseen becomes as important as the visible, professional dramatic lighting that transforms ordinary scenes into visual art
      cn: 强方向性的高对比戏剧性光线，深邃墨影和明亮镜面高光创造大胆的视觉宣言，通过极端的明暗比强调形态的单光源照明（明暗对照法），该技术创造神秘、紧张和情感强度，经典黑色电影和惊悚片照明美学，每个阴影都在讲述故事，未见之地与可见之物同等重要，将普通场景转化为视觉艺术的专业戏剧性照明
    聚光灯:
