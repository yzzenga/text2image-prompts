      cn: 固体形态如液体般流动转化的液态变形视觉美学，物体之间的融化边界创造持续演变的有机形状，液态转化暗示一个万物无固定形态的持续蜕变世界，受超现实主义融化画面和当代动态设计启发，美学创造时间流动性和短暂性的感觉，状态间的平滑过渡模拟零重力下液体的行为，一种庆祝持续转化之美的催眠视觉语言
💡 光影效果:
  光源类型:
    自然光:
      en: Beautiful natural daylight illumination creating soft, organic shadows and gentle highlights, the most flattering and authentic lighting source for cinematography, window light providing directional quality with soft diffusion, the color temperature shifts naturally throughout the day from cool morning to warm afternoon, natural light cinematography requires working with available conditions but produces the most genuine and organic results, creates a timeless and authentic visual quality that artificial light struggles to replicate
      cn: 美丽的自然日光照明创造柔和的有机阴影和温和高光，电影摄影中最讨喜和真实的光源，提供柔光扩散的方向性窗光，色温从清晨冷色到午后暖色自然变化，自然光摄影需要配合可用条件但产生最真实有机的效果，创造人工光源难以复制的永恒真实视觉品质
