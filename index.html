<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文生图提示词工坊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
        }
        
        h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #888;
            font-size: 1.1em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
            margin-top: 30px;
        }
        
        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
        
        .modules-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .module {
            margin-bottom: 25px;
        }
        
        .module-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            user-select: none;
        }
        
        .module-icon {
            font-size: 1.5em;
        }
        
        .module-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #00d2ff;
        }
        
        .module-toggle {
            margin-left: auto;
            transition: transform 0.3s;
        }
        
        .module-toggle.collapsed {
            transform: rotate(-90deg);
        }
        
        .module-content {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            transition: max-height 0.3s, opacity 0.3s;
            overflow: hidden;
        }
        
        .module-content.collapsed {
            max-height: 0;
            opacity: 0;
        }
        
        .prompt-tag {
            padding: 8px 16px;
            background: rgba(0,210,255,0.1);
            border: 1px solid rgba(0,210,255,0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9em;
            user-select: none;
        }
        
        .prompt-tag:hover {
            background: rgba(0,210,255,0.2);
            transform: translateY(-2px);
        }
        
        .prompt-tag.selected {
            background: rgba(0,210,255,0.4);
            border-color: #00d2ff;
            box-shadow: 0 0 10px rgba(0,210,255,0.5);
        }
        
        .result-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 20px;
            height: fit-content;
        }
        
        .result-title {
            font-size: 1.3em;
            font-weight: 600;
            margin-bottom: 15px;
            color: #00d2ff;
        }
        
        .result-area {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 20px;
            min-height: 200px;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .result-empty {
            color: #666;
            font-style: italic;
        }
        
        .result-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,210,255,0.4);
        }
        
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }
        
        .selected-count {
            text-align: center;
            margin-top: 15px;
            color: #888;
        }
        
        .custom-prompt {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        
        .custom-prompt label {
            display: block;
            margin-bottom: 8px;
            color: #888;
        }
        
        .custom-input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 0.95em;
            resize: vertical;
        }
        
        .custom-input:focus {
            outline: none;
            border-color: #00d2ff;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .search-box {
            margin-bottom: 20px;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 20px;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            color: #e0e0e0;
            font-size: 1em;
        }
        
        .search-input:focus {
            outline: none;
            border-color: #00d2ff;
        }
        
        .search-input::placeholder {
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 文生图提示词工坊</h1>
            <p class="subtitle">选择模块中的提示词，自动生成并复制使用</p>
        </header>
        
        <div class="main-content">
            <div class="modules-panel">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="🔍 搜索提示词..." id="searchInput">
                </div>
                
                <div id="modulesContainer"></div>
            </div>
            
            <div class="result-panel">
                <div class="result-title">📝 生成的提示词</div>
                <div class="result-area" id="resultArea">
                    <span class="result-empty">请从左侧选择提示词...</span>
                </div>
                <div class="selected-count" id="selectedCount">已选择: 0 个提示词</div>
                <div class="result-actions">
                    <button class="btn btn-primary" onclick="copyPrompt()">📋 复制</button>
                    <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空</button>
                </div>
                <div class="custom-prompt">
                    <label>自定义提示词（可选，将添加到末尾）</label>
                    <textarea class="custom-input" id="customInput" rows="3" placeholder="输入自定义提示词..."></textarea>
                </div>
            </div>
        </div>
    </div>
    
    <div class="toast" id="toast">已复制到剪贴板!</div>
    
    <script>
        const promptData = {

            },

            },

                "侧面视角": "side view",

            },
            "✨ 特效氛围": {
                "粒子特效": "particle effects",
                "光晕效果": "lens flare",
                "模糊背景": "bokeh background",
                "动态模糊": "motion blur",
                "雨雪效果": "rain and snow",
                "烟雾缭绕": "mist and fog",
                "星空背景": "starry sky",
                "极光效果": "aurora borealis",
                "火焰效果": "fire effects",
                "水波纹": "water ripples",
                "彩虹": "rainbow",
                "闪电": "lightning"
            },
            "🖌️ 细节修饰": {
                "精细纹理": "intricate textures",
                "高光泽": "high gloss matte",
                "磨砂质感": "frosted texture",
                "透明材质": "transparent material",
                "金属质感": "metallic texture",
                "木纹质感": "wooden texture",
                "大理石纹理": "marble texture",
                "织物纹理": "fabric texture",
                "皮肤质感": "skin texture",
                "发光效果": "glowing effect",
                "反射效果": "reflection",
                "阴影效果": "shadow"
            }
        };
        
        let selectedPrompts = [];
        
        function renderModules() {
            const container = document.getElementById('modulesContainer');
            container.innerHTML = '';
            
            for (const [moduleName, prompts] of Object.entries(promptData)) {
                const module = document.createElement('div');
                module.className = 'module';
                module.innerHTML = `
                    <div class="module-header" onclick="toggleModule(this)">
                        <span class="module-icon">${moduleName.split(' ')[0]}</span>
                        <span class="module-title">${moduleName.split(' ').slice(1).join(' ')}</span>
                        <span class="module-toggle">▼</span>
                    </div>
                    <div class="module-content" id="content-${moduleName}">
                        ${Object.entries(prompts).map(([cn, en]) => 
                            `<span class="prompt-tag" data-prompt="${en}" onclick="togglePrompt(this, '${en}')">${cn}</span>`
                        ).join('')}
                    </div>
                `;
                container.appendChild(module);
            }
        }
        
        function toggleModule(header) {
            const content = header.nextElementSibling;
            const toggle = header.querySelector('.module-toggle');
            content.classList.toggle('collapsed');
            toggle.classList.toggle('collapsed');
        }
        
        function togglePrompt(element, prompt) {
            element.classList.toggle('selected');
            
            if (selectedPrompts.includes(prompt)) {
                selectedPrompts = selectedPrompts.filter(p => p !== prompt);
            } else {
                selectedPrompts.push(prompt);
            }
            
            updateResult();
        }
        
        function updateResult() {
            const resultArea = document.getElementById('resultArea');
            const selectedCount = document.getElementById('selectedCount');
            const customInput = document.getElementById('customInput').value.trim();
            
            let allPrompts = [...selectedPrompts];
            if (customInput) {
                allPrompts.push(customInput);
            }
            
            if (allPrompts.length === 0) {
                resultArea.innerHTML = '<span class="result-empty">请从左侧选择提示词...</span>';
            } else {
                resultArea.textContent = allPrompts.join(', ');
            }
            
            selectedCount.textContent = `已选择: ${selectedPrompts.length} 个提示词${customInput ? ' + 自定义' : ''}`;
        }
        
        function copyPrompt() {
            const resultArea = document.getElementById('resultArea');
            const customInput = document.getElementById('customInput').value.trim();
            
            let allPrompts = [...selectedPrompts];
            if (customInput) {
                allPrompts.push(customInput);
            }
            
            if (allPrompts.length === 0) {
                showToast('请先选择提示词！');
                return;
            }
            
            const textToCopy = allPrompts.join(', ');
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast('已复制到剪贴板!');
            }).catch(() => {
                // Fallback for older browsers
                const textarea = document.createElement('textarea');
                textarea.value = textToCopy;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('已复制到剪贴板!');
            });
        }
        
        function clearAll() {
            selectedPrompts = [];
            document.querySelectorAll('.prompt-tag.selected').forEach(tag => {
                tag.classList.remove('selected');
            });
            document.getElementById('customInput').value = '';
            updateResult();
            showToast('已清空所有选择');
        }
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
        
        function filterPrompts() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const allTags = document.querySelectorAll('.prompt-tag');
            
            allTags.forEach(tag => {
                const text = tag.textContent.toLowerCase();
                const prompt = tag.dataset.prompt.toLowerCase();
                const match = text.includes(searchInput) || prompt.includes(searchInput);
                tag.style.display = match ? '' : 'none';
            });
        }
        
        // Initialize
        renderModules();
        document.getElementById('searchInput').addEventListener('input', filterPrompts);
        document.getElementById('customInput').addEventListener('input', updateResult);
    </script>
</body>
</html>
