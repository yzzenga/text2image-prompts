      cn: FPV穿越机以极高速度翱翔在广袤山脉和城市景观之上，从谷底爬升穿过云层到达云上晴空然后沿着悬崖面俯冲掠过树梢数米处，广角镜头捕捉从全景到亲密地面细节的戏剧性尺度变化在一次连续飞行中完成，无人机沿着河流在水面高度穿过狭窄峡谷然后拉升进入瀑布水雾之中，高度变化带来的动态深度压缩创造过山车般的视觉感受，2.35:1电影宽银幕比例，4K画质120fps色彩饱满，刺激和令人敬畏的氛围
  竖屏运镜:
    竖屏跟拍:
      en: A fashion influencer walking through a neon-lit Tokyo alley at night in 9:16 vertical format, the camera following her from behind as she strolls past ramen shops and vending machines, the gimbal tracking her movement vertically as she ascends a staircase between two glowing billboards, steam rising from street food stalls catching the neon reflections, she turns to glance at the camera with a confident smile while the background shifts from cramped alley to open rooftop terrace with city lights below, 4K vertical video quality, stylish and energetic urban atmosphere
      cn: 时尚博主在夜间霓虹灯闪烁的东京小巷中行走的9:16竖屏画面，摄影机从身后跟随她经过拉面店和自动贩卖机，当她走上两个发光广告牌之间的楼梯时稳定器垂直跟踪她的运动，街边小吃摊升起的蒸汽反射着霓虹灯光，她回头自信地对镜头微笑同时背景从狭窄小巷切换到俯瞰城市灯光的屋顶露台，4K竖屏画质，时尚而充满活力的都市氛围
    竖屏环绕:
      en: A street dancer performing breaking moves on a graffiti-covered pedestrian bridge in 9:16 vertical format, the camera orbiting around him in a tight vertical circle while he executes a headspin, the colorful graffiti murals on both sides of the bridge creating a kaleidoscope of urban art as the background rotates, golden hour sunlight streaming through the bridge railings casting long shadows, a small crowd of onlookers reacting with amazement visible at the edges of the orbit, the camera completes a full revolution revealing the river and skyline beyond the bridge, 4K vertical quality, raw and dynamic street culture atmosphere
      cn: 街头舞者在涂鸦覆盖的人行天桥上表演霹雳舞的9:16竖屏画面，摄影机围绕他进行紧凑的垂直环绕同时他正在执行头旋，天桥两侧色彩斑斓的涂鸦壁画随着背景旋转形成万花筒般的城市艺术，黄金时刻阳光透过桥栏杆投射出长长的身影，围观人群在环绕边缘露出惊叹表情，摄影机完成一整圈环绕揭示桥外的河流和城市天际线，4K竖屏画质，原始而充满活力的街头文化氛围
    竖屏推拉:
      en: A pastry chef presenting a towering multi-layer chocolate cake in a warm bakery kitchen in 9:16 vertical format, the camera starting from a wide shot showing the entire kitchen with flour-dusted countertops and hanging copper pots, then slowly pushing in toward the cake as the chef adds the final gold leaf decoration on top, the pull-out reveals the full scale of the bakery as the chef lifts the cake to the window where morning sunlight illuminates the chocolate ganache, the vertical format emphasizing the height of both the cake and the tall bakery windows, 4K vertical quality, warm and inviting artisanal atmosphere
      cn: 烘焙师在温暖的面包店厨房中展示一座多层巧克力蛋糕的9:16竖屏画面，摄影机从展示整个厨房的宽景开始——撒满面粉的台面和悬挂的铜锅，然后缓缓推近蛋糕同时烘焙师放上最后的金箔装饰，拉远揭示面包店的完整规模同时烘焙师将蛋糕举到窗边，晨光照射在巧克力酱上，竖屏格式强调蛋糕和面包店高窗的高度，4K竖屏画质，温暖而诱人的匠人氛围
    竖屏转场:
      en: A lifestyle vlogger in 9:16 vertical format transitioning from morning to evening routine, starting with an upward whip pan from her coffee cup on the breakfast table past hanging pendant lights, the whip emerging into a new scene where she walks through a sunlit park with autumn leaves falling around her, a quick downward tilt past a street lamp transitions to an evening rooftop bar scene with the city skyline glowing behind her, each vertical transition using overhead elements and environmental objects as natural wipes, the tall frame emphasizing the vertical flow from morning coffee to sunset cocktails, 4K vertical quality, aspirational and aesthetically curated lifestyle atmosphere
      cn: 生活方式博主的9:16竖屏画面展示从晨间到晚间的日常转场，从早餐桌上咖啡杯的上甩镜开始经过悬挂的吊灯，甩镜切入新场景她走过秋叶飘落的阳光公园，快速下摇经过路灯过渡到晚间屋顶酒吧场景身后城市天际线闪烁，每个竖屏转场利用头顶元素和环境物体作为自然划像，竖屏画框强调从晨间咖啡到日落鸡尾酒的垂直流动，4K竖屏画质，令人向往且精心策划的生活方式氛围
  机内转场:
    物体遮挡转场:
      en: A barista carrying a tall tray of coffees walks directly in front of the camera in a busy cafe, the tray fills the entire frame blocking all light, then the tray passes revealing a completely different scene — a sunset beach with waves lapping at the shore, the in-camera wipe requires no post-production, the speed of the barista's walk determines the transition pace, the same technique used with a passing bus on a city street transitions from a morning commute to a lively night market, 4K quality, natural lighting in both scenes, seamless and surprising transition
      cn: 咖啡师端着高高的咖啡托盘在繁忙的咖啡馆中直接走过镜头前方，托盘填满整个画框遮挡所有光线，然后托盘经过揭示一个完全不同的场景——夕阳海滩海浪轻拍岸边，机内划像无需后期制作，咖啡师行走的速度决定转场节奏，同样的技巧用在城市街道上经过的公交车上从早高峰通勤过渡到热闹的夜市，4K画质，两个场景均为自然光线，无缝且令人惊喜的转场
    旋转转场:
      en: A skateboarder grinds a rail in a skatepark, the camera follows the motion then rapidly spins 360 degrees on its roll axis, motion blur obscures the transition point, when the spin completes the skateboarder is now surfing a massive ocean wave, the rotational blur creates the seamless cut between the two extreme sports scenes, the gimbal executes the rapid spin mode while maintaining horizon lock, popular in action sports montages and music videos for its disorienting yet fluid quality, 4K action sports footage with vibrant colors
      cn: 滑板手在滑板公园的栏杆上滑行，摄影机跟随动作然后快速在滚动轴上旋转360度，运动模糊遮蔽了转场点，旋转完成后滑板手现在正在冲乘巨浪，旋转模糊在两个极限运动场景之间创造无缝剪切，稳定器执行快速旋转模式同时保持地平线锁定，在动作运动蒙太奇和音乐视频中流行因其令人迷失方向且流畅的质感，4K极限运动画面色彩鲜艳
    穿墙转场:
      en: A dancer in a dimly lit corridor reaches toward a hanging silk curtain, the camera pushes through the fabric which fills the frame with flowing red material, emerging on the other side into a sunlit rooftop garden where she continues her dance among blooming flowers, the silk serves as the natural wipe element with its translucent texture adding a dreamlike quality to the transition, the camera physically passes through the curtain while the environment transforms on the other side, carefully staged set design makes the surface practical on both sides, 4K cinematic quality with warm golden lighting on the rooftop
      cn: 舞者在昏暗的走廊中伸手触碰悬挂的丝绸帷幕，摄影机穿过织物画框被流动的红色材料填满，另一侧出现阳光照耀的屋顶花园她在盛开的花朵中继续舞蹈，丝绸作为自然划像元素其半透明质感为转场增添梦幻质感，摄影机物理穿过帷幕同时另一侧环境发生变换，精心设计的场景布置使表面两侧均为实景，4K电影级画质屋顶场景温暖金色光线
    甩镜转场:
      en: A chef in a professional kitchen tosses a pan upward, the camera whip-pans horizontally to follow the flying food creating extreme motion blur, during the blurred moment the scene changes, the pan continues to its final position revealing a street food vendor catching a skewer at a bustling night market, the whip pan direction matches the visual flow from left to right, the background becomes a colored blur during the whip that bridges the kitchen and market scenes, the most classic and reliable in-camera transition, 4K food documentary style with rich saturated colors
      cn: 专业厨房中的厨师将锅向上抛起，摄影机水平甩镜跟随飞起的食物创造极端运动模糊，模糊瞬间场景变换，摇镜继续至最终位置揭示夜市中接住烤串的街边摊贩，甩镜方向与从左到右的视觉流向一致，甩镜期间背景变为连接厨房和市场场景的彩色模糊，最经典可靠的机内转场技术，4K美食纪录片风格色彩浓郁饱和
  手机稳定器运镜:
    口袋稳定器运镜:
      en: A travel vlogger holding a compact DJI Osmo Pocket glides through a crowded Marrakech souk, the camera floating smoothly past spice stalls with vibrant pyramids of saffron and turmeric, hanging leather lanterns casting warm patterned shadows, the lightweight gimbal allowing fluid single-handed operation as she weaves between shoppers, the camera drops to low-mode capturing ground-level tracking of a cat slinking between merchant feet, then rises back up revealing the souk's arched ceiling with shafts of dusty sunlight, 4K travel vlog quality with rich warm tones, intimate and immersive atmosphere
      cn: 旅行博主手持小巧的DJI Osmo Pocket在拥挤的马拉喀什集市中穿行，摄影机平滑滑过香料摊位——藏红姜和姜黄堆成鲜艳的金字塔，悬挂的皮革灯笼投射出温暖的图案阴影，轻量化稳定器允许流畅的单手操作她在购物者间穿梭，摄影机降至低模式以地面视角跟踪一只在商贩脚间溜过的猫，然后升起揭示集市拱形天花板和穿透的阳光尘柱，4K旅行Vlog画质暖色调丰富，亲密沉浸的氛围
    手机推拉运镜:
      en: A couple sits across from each other at a candlelit restaurant table, the operator holding a mobile gimbal slowly pushes in from a wide shot of the entire dining room toward the couple's hands as they reach for each other across the table, the push-in creates growing intimacy and emotional focus, then the pull-out reveals the full romantic setting — rose petals on the floor, string lights overhead, other diners blurred in background, the heel-toe walking technique keeps the movement perfectly smooth without a dolly track, 4K quality with warm ambient candlelight, romantic and emotionally resonant atmosphere
      cn: 一对情侣坐在烛光餐厅的餐桌对面，操作者手持手机稳定器从整个餐厅的宽景缓缓推近至两人伸手相触的双手，推近创造不断增强的亲密感和情感聚焦，然后拉远揭示完整的浪漫场景——地上玫瑰花瓣、头顶串灯、其他食客虚化在背景中，脚跟着地行走技巧使运动无需轨道也完美平滑，4K画质温暖环境烛光，浪漫且情感共鸣的氛围
    手机环绕拍摄:
      en: A street musician plays an accordion on a cobblestone corner in Paris at golden hour, the operator circles around him with a mobile gimbal keeping him centered in frame, the orbit reveals changing backgrounds — the Eiffel Tower visible down one street, a row of painted townhouses down another, cafe patrons watching from sidewalk tables, the orbit speed starts slow and contemplative then accelerates creating energy and excitement, combining the orbit with a slight vertical boom reveals the full height of the Haussmann buildings against the amber sky, 4K quality with golden hour warmth, lively Parisian atmosphere
      cn: 街头音乐家在巴黎金色时刻的鹅卵石街角演奏手风琴，操作者用手机稳定器围绕他环绕保持主体居中，环绕揭示不断变化的背景——一条街可见埃菲尔铁塔，另一条街是成排彩绘联排别墅，咖啡馆顾客在人行道餐桌旁观看，环绕速度从缓慢沉思开始然后加速创造活力和兴奋，环绕结合轻微垂直升降揭示奥斯曼建筑在琥珀色天空下的完整高度，4K画质黄金时刻暖调，生动的巴黎氛围
    手机运镜:
      en: A food blogger documents a street taco vendor's craft in a single continuous take using a mobile gimbal, starting with a tracking shot following the vendor's hands as he pulls steaming meat from a vertical spit, transitioning to an orbit around the sizzling griddle as he chops cilantro and onions, pushing in for a close-up of the assembled taco being drizzled with lime, then pulling back to show the growing line of eager customers, the operator switches between follow mode and POV mode for different movement textures, seamless gimbal-to-handheld transitions as he passes the taco to a customer, 4K street food documentary quality with vivid colors, authentic and appetizing atmosphere
      cn: 美食博主用手机稳定器在单一连续镜头中记录街头塔可摊贩的手艺，从跟拍摊贩手从垂直烤肉架上取出热气蒸腾的肉开始，过渡到围绕滋滋作响的烤架环绕拍摄他切香菜和洋葱，推近特写组装好的塔可被淋上青柠汁，然后拉回展示排队等候的顾客越来越多，操作者在跟随模式和POV模式之间切换获得不同运动质感，从稳定器到手持的无缝过渡将塔可递给顾客，4K街头美食纪录片画质色彩鲜艳，真实诱人的氛围
  运动控制运镜:
    电控滑轨延时:
      en: A breathtaking city skyline time-lapse captured with a motorized slider at golden hour, the camera gliding smoothly along a programmed curved track over 3 hours as the sun sets behind the iconic skyscrapers, clouds racing across the sky in compressed time like rivers of fire, city lights flickering on one by one like stars awakening across the urban landscape, traffic flowing in ribbons of red and white light through the streets below, the smooth motion control creating a dynamic sculpture of time and light, the slider's programmed acceleration and deceleration adding organic rhythm to the camera movement, 8K ultra HD resolution, warm golden hour transitioning through purple twilight to deep blue night, cinematic HDR color grading
      cn: 黄金时刻以电控滑轨捕捉的令人屏息的城市天际线延时摄影，摄影机沿编程弯曲轨道在3小时内平滑滑行，太阳在标志性摩天楼后缓缓落下，云层在压缩时间中如火焰之河般急速流动，城市灯火如繁星般一颗颗亮起，车流在下方街道化作红白交织的光之缎带，平滑的运动控制创造出时间与光线的动态雕塑，滑轨的编程加减速为摄影机运动增添有机的节奏感，8K超高清分辨率，从温暖黄金时刻经过紫色暮光过渡到深邃蓝色夜晚，电影级HDR调色
    大范围延时:
      en: A dynamic hyperlapse journey through the heart of Tokyo, the camera moving hundreds of meters between each frame, starting from the quiet alleys of Asakusa at dawn with the Senso-ji temple silhouette, transitioning through the neon-lit chaos of Shinjuku at midday with crowds flowing like living rivers, to the serene Meiji Shrine forest path in golden afternoon light, culminating at the futuristic Shibuya crossing at night where thousands of pedestrians cross in an organized dance, the extreme camera movement creating a sensation of flying through time and space, each position carefully marked and stabilized into impossibly smooth motion, 8K resolution with professional hyperlapse stabilization, the journey of a city in 20 seconds
      cn: 穿越东京心脏地带的动态超延时旅程，每帧之间摄影机移动数百米，从黎明时分浅草寺剪影下的安静小巷开始，过渡到正午新宿霓虹灯迷宫的混乱人群如生命之河般流动，再到午后金色光线中明治神宫的森林小径，最后到达夜晚的未来感涩谷十字路口数千行人以有序舞蹈交叉穿梭，极端摄影机运动创造飞越时空的感觉，每个位置被精心标记并稳定为不可思议的平滑运动，8K分辨率配合专业超延时稳定处理，一座城市20秒的时空之旅
    日转夜延时:
      en: A Holy Grail time-lapse of the Sydney Harbour, beginning in the bright afternoon with sailboats gliding across the sparkling water, transitioning through the golden hour as the sky ignites in warm orange and pink hues behind the Opera House sails, the Harbour Bridge emerges in silhouette, the city skyline gradually illuminates as dusk deepens, the exposure seamlessly ramping from bright day to twilight to night, the stars emerging in the deep indigo sky reflected in the harbour waters, the motion control slider executing a slow programmed pan from the Opera House to the Bridge throughout the 12-hour capture, all compressed into 20 seconds of cinematic perfection, 8K HDR quality with professional Holy Grail exposure ramping technique
      cn: 悉尼港的Holy Grail延时摄影，从明亮的午后开始帆船在波光粼粼的水面上滑行，过渡到黄金时刻天空在歌剧院帆顶后方被温暖橙粉色点燃，海港大桥浮现剪影，城市天际线随着暮光加深逐一亮起，曝光从明亮白天到暮光再到夜晚无缝爬坡，繁星在深邃靛蓝天空中浮现映照在海港水面上，运动控制滑轨在12小时拍摄中执行从歌剧院到大桥的缓慢编程摇镜，全部压缩为20秒的电影完美，8K HDR画质配合专业Holy Grail曝光爬坡技术
    星空延时:
      en: The Milky Way galaxy arching majestically over the silhouette of a lone Joshua tree in the Mojave Desert at midnight, a motorized star tracker rotating the camera at the exact sidereal rate keeping every star pin-sharp as points of light, the 6-hour time-lapse revealing the slow sacred dance of the celestial sphere, star trails forming concentric circles around the North Star like cosmic clockwork, the ancient desert landscape bathed in ambient starlight and the faint green glow of airglow on the horizon, a meteor occasionally streaking through the frame leaving a brief trail of fire, the combination of star tracker motion with a secondary axis creating subtle foreground parallax, 8K astrophotography quality with deep space clarity and rich celestial colors
      cn: 午夜时分莫哈韦沙漠中银河拱桥壮丽地越过孤寂的约书亚树剪影，电动星轨仪以精确恒星星速率旋转摄影机使每颗星星保持针尖般锐利的光点，6小时延时揭示天球的缓慢神圣舞蹈，星迹如宇宙发条般围绕北极星形成同心圆，古老的沙漠景观被环境星光和地平线上微弱的大气辉光绿光沐浴，偶尔有流星划过画面留下一道短暂火焰轨迹，星轨仪运动与二级轴结合创造微妙的前景视差，8K天文摄影品质，深空般清澈，丰富天体色彩
    子弹时间:
      en: A dramatic bullet time moment at a glamorous red carpet premiere, a movie star in a stunning designer gown arriving at the grand entrance looking back over her shoulder with a radiant smile, the camera array activates freezing the instant - her flowing dress hem caught mid-twirl creating a perfect circle of fabric frozen in motion, camera flashes from photographers creating hundreds of frozen light pillars around her, the velvet ropes and golden stanchions reflecting the spotlight, confetti and flash powder suspended in the air like diamonds and stardust, her hair frozen mid-sweep across her face, the grand movie palace marquee glowing behind her with tonight's premiere title, the camera orbits 360 degrees around the frozen star, each angle revealing new details, then time resumes she continues her walk cameras flash confetti falls, 8K cinematic quality, warm golden glamour lighting, shallow depth of field
      cn: 华丽红毯首映礼上的戏剧性子弹时间瞬间，一位电影巨星身着惊艳设计师礼服抵达宏伟入口，回头望向肩后绽放灿烂笑容，相机阵列激活冻结了这一瞬间——她飘逸的裙摆裙边被凝固在半旋转中形成完美的织物圆环，摄影师的相机闪光灯在她周围创造数百道凝固的光柱，天鹅绒绳索和金色立柱反射着聚光灯，彩纸和闪光粉末如钻石和星尘般悬浮在空中，她的头发凝固在半扫过脸庞的姿态中，宏伟的电影宫殿招牌在她身后闪耀着今晚的首映标题，相机360度环绕冻结的巨星，每个角度揭示新的细节，然后时间恢复她继续前行相机闪光彩纸飘落，8K电影画质，温暖金色魅力灯光，浅景深

      cn: 增加场景深度和情绪的氛围雾气效果，悬浮的微粒捕捉光线创造体积光并柔化远处元素，物体在远处淡出的大气透视添加真实深度线索，雾气通过模糊远处事物创造神秘和紧张感，温暖金色雾气创造魔法森林氛围，冷灰色雾唤起黑色电影神秘或恐怖张力，专业大气效果需要精心控制密度以在维持可见度的同时达到理想情绪

      cn: 柔化高光创造浪漫空灵氛围的梦幻光晕效果，光源柔和地漫溢到边缘之外将场景包裹在温暖朦胧的质感中，效果模拟复古柔焦或梦境序列的电影摄影，皮肤呈现发光质感，头发和肩膀周围有柔和光晕，在浪漫、奇幻和闪回序列中因其永恒的超凡美感而流行，专业实现在保持细节的同时增添标志性的梦幻漫射

  光效增强:

      cn: 受控的镜头光晕元素增添电影制作价值和视觉趣味，画框内或紧邻画框外的光源产生特征性的多边形反射和彩色条纹横跨画面，变形宽银幕光晕产生与好莱坞电影相关的独特蓝色水平条纹，光晕增添氛围和自然光真实感，策略性放置的光晕可引导视线或创造温暖即时感，专业光晕应用巧妙而有目的，增强而非遮蔽画面

      cn: 复古VHS磁带美学重现80年代和90年代模拟家用视频的独特外观，特征性伪像包括色彩渗色、水平色度偏移、跟踪误差和分辨率降低，不完美的画质触发即时的怀旧识别，格式的限制成为其艺术签名，过曝的高光和压黑的阴影配合低饱和色盘，美学唤起家庭录像、租赁磁带和模拟电视广播的记忆，适合年代内容和复古主题制作的怀旧视觉风格

      cn: 有意数据损坏创造引人注目的视觉伪像的数字故障艺术美学，像素块碎片化图像、颜色通道错位和数据混叠效果，该美学将技术的失败模式作为创意表达拥抱，损坏的图像数据从可识别的源材料中创造出意想不到的抽象构图，传达数字焦虑、信息时代超载或技术衰退的主题，在音乐视频、赛博朋克内容和前卫视觉艺术中流行，受控的混乱需要精确的技术执行

      cn: 增强的纹理渲染揭示每个表面的触感质感，从织物编织和木纹到皮肤毛孔和自然图案，增强的细节创造将观众拉入画面的可触真实感，专业纹理增强在尊重原始材质的同时使其更可感知，该技术增加值得细细品味的视觉丰富度，8K分辨率成为这种精细细节工作的理想画布

  运动模糊:
    自然运动模糊:
      en: Organic motion blur that naturally occurs when objects move relative to the camera shutter, the blur trails create a sense of speed and temporal continuity, proper motion blur is essential for natural-looking motion at 24fps, the length and character of the blur convey the speed and weight of the movement, too little motion blur creates stroboscopic effect, too much looks artificial, professional cinematography balances shutter angle (typically 180 degrees) for the most natural motion blur characteristics
      cn: 物体相对于摄影机快门运动时自然产生的有机运动模糊，模糊拖尾创造速度和时间的连续感，适当的运动模糊对于24fps下的自然运动外观至关重要，模糊的长度和特性传达运动的速度和重量，运动模糊太少产生频闪效应，太多则显得人工，专业电影摄影平衡快门角度（通常是180度）以获得最自然的运动模糊特性
    创意模糊:

  颜色彩纤:

  色彩修饰:
    肤色校正:
      en: Professional skin tone color correction ensuring natural and flattering flesh tones across all lighting conditions and skin types, precise adjustment of hue, saturation, and luminance in the skin tone range creates consistent and beautiful complexion rendering, vectorscope monitoring ensures skin tones fall on the correct color line, the correction removes unwanted color casts from lighting while preserving healthy natural variation, essential for portrait and beauty cinematography where accurate skin reproduction is critical, the foundation of professional color grading for any content featuring people
      cn: 专业肤色校正确保所有照明条件和肤色类型下自然讨喜的肤色呈现，精确调整肤色范围内的色相、饱和度和明度创造一致美丽的肤色渲染，矢量示波器监控确保肤色落在正确的色彩线上，校正去除照明带来的不想要的色偏同时保留健康的自然变化，对于肤色再现至关重要的人像和美妆摄影必不可少，任何包含人物的内容的专业调色基础
    分离色调:
      en: Split toning color grading technique where different color tones are applied independently to the shadow and highlight regions of the image, creating sophisticated stylized color contrast, common combinations include cool blue shadows with warm orange highlights or vintage sepia shadows with cream highlights, the technique adds depth and emotional resonance through complementary color relationships within the luminance range, popular in cinematic and editorial photography for its ability to create cohesive mood, professional split toning maintains natural skin tones while applying stylized color to shadows and highlights
      cn: 分别独立对图像阴影和高光区域应用不同色调的分色调色技术，创造出精致的风格化色彩对比，常见组合包括冷蓝阴影配暖橙高光或复古棕褐阴影配奶油高光，该技术通过亮度范围内的互补色关系增加深度和情感共鸣，在电影和编辑摄影中因其创造统一氛围的能力而流行，专业分色调色在应用风格化色彩于阴影和高光的同时保持自然肤色
    二级调色:
      en: Secondary color correction isolating and adjusting specific colors within the image without affecting others, precise hue, saturation, and luminance targeting using qualifier tools, selective color enhancement can make a product pop, correct an unnatural green in foliage, or shift a specific wardrobe color, power windows and tracking allow regional color adjustments that follow moving subjects, the most powerful tool in the colorist's arsenal for targeted creative control, professional secondary grading requires careful feathering and tracking to remain invisible
      cn: 隔离并调整图像中特定色彩而不影响其他色彩的二级调色，使用限定器工具精确针对色相、饱和度和明度，选择性色彩增强可使产品突出、修正树叶不自然的绿色或调整特定服装颜色，动态遮罩和跟踪允许跟随移动主体的局部色彩调整，调色师武器库中最强大的目标创意控制工具，专业二级调色需要谨慎的边缘羽化和跟踪以保持不露痕迹

    镜头光晕:

  自然现象:

      cn: 为外景场景增添情绪、纹理和制作价值的雨雾效果，雨滴打落在路面、树叶和水面时创造动态的表面交互，降水捕捉光线创造美丽的体积效果，雾气柔化背景并通过大气透视增加深度，雨声本身具有电影感，雨水浸透的场景传达忧郁、新生或戏剧张力，专业雨效需要精心照明使雨滴在镜头中可见

  时间效应:

      cn: 将数小时或数天压缩为数秒屏幕时间的延时摄影，揭示自然和建筑世界缓慢庄严的韵律，加速的云层运动在天空中形成流动的河流，喧嚣的城市街道转化为人类运动的川流，该技术使环境中不可见的时间流逝变得可见，需要精确的间隔拍摄控制和帧间一致的曝光，专业Holy Grail延时摄影在日转夜过渡中平滑调整曝光，8K分辨率保留加速帧中的细节

      cn: 以专业微距镜头和技术揭示微小主体隐藏宇宙的极致微距摄影，捕捉肉眼不可见的细节，露珠成为折射整个景观的水晶球体，昆虫眼睛转化为复杂的几何图案，微观世界以令人屏息的尺度和细节呈现，需要在极浅景深下的精确对焦控制，以及近距离照亮主体的专业照明，该技术打开了仅通过微距镜头才能进入的隐藏视觉叙事维度
    鱼眼效果:

      cn: 超广鱼眼镜头效果创造接近180度半球视场的极端桶形畸变，标志性的弧形透视将中心向前推同时将边缘剧烈弯曲，根据应用场景创造好玩、沉浸或迷失方向的视觉风格，极端景深从几英寸到无限远都保持对焦，在极限运动、创意音乐视频和超现实视觉序列中流行，独特视角模拟穹顶或沉浸式环境的观看体验

      cn: 捕捉可见光谱之外光线的红外摄影，创造超现实异世界般的画面， foliage呈现出白色或空灵粉色的辉光，天空变成深紫色或黑色，人类皮肤呈现出半透明的瓷器质感，不可见光揭示了与我们可见现实并存的隐藏世界，标志性的梦幻质感配合发光的植被和戏剧性对比，需要专业的改装相机或阻挡可见光而通过红外波长的光学滤镜，一种小众但视觉惊艳的创造真正独特画面的技术

  景别设置:

      cn: 捕捉地点全貌的宽阔建立镜头，将主体置于环境中并建立空间背景，广阔的画面揭示元素之间的关系并创建尺度感，常用于场景开场镜头为观众定位，宽景让观众沉浸感受世界的视觉信息，专业宽景构图使用前景、中景和背景层次在广阔画面中创造深度
    中景:
      en: Medium shot framing the subject from roughly the waist up, the most versatile and commonly used shot size in cinematography, balances subject detail with environmental context, the standard shot for dialogue and interaction sequences, allows for clear view of facial expressions and body language while maintaining spatial awareness, the go-to shot for most narrative coverage, professional medium shot composition considers headroom, eyeline, and the rule of thirds for balanced framing
      cn: 大致从腰部以上构图的中景镜头，电影摄影中最通用和常用的景别，平衡了主体细节与环境背景，对话和互动序列的标准镜头，在保持空间意识的同时清晰展现面部表情和肢体语言，大多数叙事覆盖的首选镜头，专业中景构图考虑头顶空间、视线方向和三分法以实现平衡构图
    特写:

      cn: 以亲密强度构图面部或特定细节的特写镜头，特写揭示推动叙事共情的微表情和情感细微差别，将主体从干扰中隔离完全聚焦观众注意力，电影制作者武器库中最有力的情感叙事工具，特写的极端亲密性在主体和观众之间创造特权连接，专业特写构图用主体填满画面，背景成为次要或不可见
    极特写:

      cn: 聚焦微观细节的极致特写微距镜头：一只眼睛、说话的双唇、做精细工作的双手，画面隔离主体的微小碎片放大其重要性，极致细节创造纹理和形态成为主体的抽象构图，将注意力引向关键情节细节或情感线索的终极工具，极致特写需要精确对焦和稳定拍摄，揭示常规构图错过的世界中的世界
  构图方式:
    三分法:
      en: Classic composition technique dividing the frame into a 3x3 grid, placing key elements along the grid lines or at their intersections creates balanced and visually pleasing compositions, the rule of thirds guides the viewer's eye through the frame in a natural way, placing the subject off-center creates dynamic tension and visual interest, the technique is a guideline rather than a rigid rule, professional application knows when to follow and when to break it for specific effects, the foundation of visual composition in cinematography
      cn: 将画面分为3x3网格的经典构图技术，将关键元素置于网格线或交叉点上创造平衡而视觉愉悦的构图，三分法以自然方式引导观众视线穿过画面，将主体偏置创造动态张力和视觉趣味，该技术是指南而非严格规则，专业应用知道何时遵循何时打破以达特定效果，电影摄影中视觉构图的基础
    对称构图:
      en: Perfectly balanced symmetrical composition where elements mirror each other across the central axis, creates a sense of formality, grandeur, and stability, the balanced frame communicates order and intentionality, commonly used for architectural photography, formal portraits, and establishing shots of monumental spaces, the symmetry draws the eye to the center creating a focal point of absolute clarity, professional symmetrical composition requires precise alignment and often benefits from including a minor asymmetrical element for contrast
      cn: 元素沿中轴线相互镜像的完美平衡对称构图，营造正式感、宏伟感和稳定感，平衡画面传达秩序和意图，常用于建筑摄影、正式人像和纪念性空间的建立镜头，对称将视线引向中心创造绝对清晰的焦点，专业对称构图需要精确对齐，通常包含微小不对称元素以形成对比
    引导线构图:

  景深设置:

      cn: 从前景到背景全部保持清晰对焦的全景深技术，画面中的一切同等可见和重要，允许观众在全面面中自主选择观看位置，该技术强调前景与背景元素之间的关系，需要小光圈设置和最佳照明条件，与奥逊·威尔斯和格雷格·托兰德相关的经典电影技术，要求景深内所有元素的精心编排
    浅景深:

      cn: 狭窄焦点平面的浅景深将主体与柔和虚化背景隔离，选择性对焦毋庸置疑地将注意力引向目标主体，奶油般柔滑的散景背景增加制作价值和美学美感，创造主体与环境之间的三维分离感，通过大光圈（f/1.4-f/2.8）和较长焦距实现，现代电影摄影中最流行的美学选择，专业浅景深将观众拉入与主体的亲密关系

  拍摄角度:

      en: Low-angle shot captured from below the subject looking upward, the perspective makes subjects appear powerful, dominant, or heroic by emphasizing their vertical presence, background elements like ceilings or sky replace the ground creating dramatic framing, the technique visually exaggerates height and importance, commonly used to portray characters in positions of authority or during moments of triumph, architectural shots from below emphasize the grandeur and scale of structures, the upward angle naturally creates a sense of awe and submission in the viewer

    荷兰角斜拍:

    过肩镜头:

    <script>
let videoData = {};
let selectedTags = [];
let copyMode = 'cn';

document.addEventListener('DOMContentLoaded', async function() {
    await loadVideoData();
    generateTabs();
    generateContent();
    setupEventListeners();
});

async function loadVideoData() {
    // 尝试 fetch 外部 YAML 文件（HTTP 服务器模式）
    try {
        const resp = await fetch('video-prompt-data.yaml');
        if (resp.ok) {
            const text = await resp.text();
            const parsed = jsyaml.load(text);
            if (parsed && typeof parsed === 'object') {
                videoData = parsed;
                return;
            }
        }
    } catch (e) {
        // fetch 失败（file:// 协议），回退到内嵌 YAML
    }
    // 回退：从内嵌 <script type="text/yaml"> 读取
    const yamlElement = document.getElementById('yamlData');
    if (!yamlElement || !yamlElement.textContent.trim()) {
        throw new Error('YAML 数据未找到（fetch 失败且无内嵌数据）');
    }
    const parsed = jsyaml.load(yamlElement.textContent);
    if (!parsed || typeof parsed !== 'object') {
        throw new Error('数据格式错误');
    }
    videoData = parsed;
}

function generateTabs() {
    const tabsNav = document.getElementById('tabsNav');
    const modules = Object.keys(videoData);
    if (modules.length === 0) {
        tabsNav.innerHTML = '<span style="color: #666;">暂无数据</span>';
        return;
    }

    const allTab = `
        <button class="tab-btn active" onclick="switchTab(this, '__all__')" data-module="__all__">
            <span class="tab-btn-icon">📋</span>
            <span>全部</span>
        </button>
    `;

    const regularTabs = modules.filter(module => module !== '🚀 快捷脚手架').map(module => `
        <button class="tab-btn" onclick="switchTab(this, '${module}')" data-module="${module}">
            <span class="tab-btn-icon">${getModuleIcon(module)}</span>
            <span>${getModuleDisplayName(module)}</span>
            <span class="tab-btn-count" id="tab-count-${module.replace(/[^a-zA-Z0-9一-鿿]/g, '')}">${countTags(module)}</span>
        </button>
    `).join('');

    const scaffoldTab = `
        <button class="tab-btn" onclick="switchTab(this, '🚀 快捷脚手架')" data-module="🚀 快捷脚手架">
            <span class="tab-btn-icon">🚀</span>
            <span>快捷脚手架</span>
            <span class="tab-btn-count" id="tab-count-快捷脚手架">${countScaffolds()}</span>
        </button>
    `;

    tabsNav.innerHTML = allTab + scaffoldTab + regularTabs;
}

function generateContent() {
    const tabsContainer = document.getElementById('tabsContainer');
    const modules = Object.keys(videoData);
    tabsContainer.innerHTML = modules.map(module => `
        <div class="tab-panel active" id="panel-${module}">
            ${generateModuleContent(module)}
        </div>
    `).join('');
}

function generateModuleContent(module) {
    const data = videoData[module];
    if (!data || Object.keys(data).length === 0) return '';

    const categories = Object.keys(data);
    return `
        <div class="tab-panel-header">
            <span class="tab-panel-title">${getModuleDisplayName(module)}</span>
            <button class="tab-clear-btn" onclick="clearModule('${module}')" id="clear-${module.replace(/[^a-zA-Z0-9一-鿿]/g, '')}">
                <span>🗑️</span> 清空
                <span class="clear-count" id="count-${module.replace(/[^a-zA-Z0-9一-鿿]/g, '')}">${getSelectedCount(module)}</span>
            </button>
        </div>
        <div class="modules-grid">
            ${categories.map(category => `
                <div class="category" data-module="${module}" data-category="${category}">
                    <div class="category-header" onclick="toggleCategory(this)">
                        <span class="category-dot"></span>
                        <span class="category-name">${category}</span>
                        <span class="category-arrow">▼</span>
                    </div>
                    <div class="tags-container">
                        ${Object.keys(data[category]).map(tag => `
                            <span class="prompt-tag" onclick="toggleTag('${module}', '${category}', '${tag}', this)" data-module="${module}" data-category="${category}" data-tag="${tag}">
                                ${tag}
                            </span>
                        `).join('')}
                    </div>
                </div>
            `).join('')}
        </div>
    `;
}

function switchTab(btn, moduleName) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const panels = document.querySelectorAll('.tab-panel');
    if (moduleName === '__all__') {
        panels.forEach(p => p.classList.add('active'));
    } else {
        panels.forEach(p => p.classList.remove('active'));
        const panel = document.getElementById('panel-' + moduleName);
        if (panel) panel.classList.add('active');
    }
}

function toggleCategory(header) {
    header.classList.toggle('collapsed');
    const arrow = header.querySelector('.category-arrow');
    arrow.classList.toggle('collapsed');
    const container = header.nextElementSibling;
    container.classList.toggle('collapsed');
}

function toggleTag(module, category, tag, element) {
    const key = `${module}:${category}:${tag}`;
    const index = selectedTags.indexOf(key);
    if (index === -1) {
        selectedTags.push(key);
        element.classList.add('selected');
    } else {
        selectedTags.splice(index, 1);
        element.classList.remove('selected');
    }
    updatePreview();
    updateStats();
    updateModuleBadge(module);
}

function clearModule(module) {
    const moduleTags = selectedTags.filter(t => t.startsWith(`${module}:`));
    moduleTags.forEach(tag => {
        const index = selectedTags.indexOf(tag);
        if (index > -1) selectedTags.splice(index, 1);
        const elements = document.querySelectorAll(`[data-module="${module}"][data-tag="${tag.split(':')[2]}"]`);
        elements.forEach(el => el.classList.remove('selected'));
    });
    updatePreview();
    updateStats();
    updateModuleBadge(module);
}

function updateStats() {
    document.getElementById('resultStats').textContent = `已选择: ${selectedTags.length} 个提示词`;
}

function getModuleIcon(module) {
    const icons = {
        '🚀 快捷脚手架': '🚀',
        '🎬 镜头运镜': '🎬',
        '📀 画面参数': '📐',
        '🎬 画面风格': '🎨',
        '💡 光影效果': '💡',
        '🌈 色彩风格': '🌈',
        '🌟 特效氛围': '🌟',
        '🖌️ 细节修饰': '🖌️',
        '🔮 特殊效果': '🔮',
        '📐 构图视角': '📐',
        '🎬 视觉特效': '✨'
    };
    return icons[module] || '📄';
}

function getModuleDisplayName(module) {
    const parts = module.split(' ');
    if (parts.length > 1) {
        return parts.slice(1).join(' ');
    }
    return module;
}

function updateModuleBadge(module) {
    const count = getSelectedCount(module);
    const key = module.replace(/[^a-zA-Z0-9一-鿿]/g, '');
    const countSpan = document.getElementById('count-' + key);
    if (countSpan) {
        countSpan.textContent = count;
        countSpan.classList.toggle('has-selected', count > 0);
    }
}

function countTags(module) {
    const data = videoData[module];
    if (!data) return 0;
    return Object.values(data).reduce((sum, cat) => sum + Object.keys(cat).length, 0);
}

function getSelectedCount(module) {
    return selectedTags.filter(t => t.startsWith(module + ':')).length;
}

function countScaffolds() {
    const scaffoldData = videoData['🚀 快捷脚手架'];
    if (!scaffoldData) return 0;
    return Object.values(scaffoldData).reduce((sum, cat) => sum + Object.keys(cat).length, 0);
}

function setCopyMode(mode) {
    copyMode = mode;
    document.querySelectorAll('.copy-mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    updatePreview();
}

function updatePreview() {
    let preview = generatePreviewText();
    document.getElementById('resultArea').textContent = preview || '请从左侧选择提示词...';
}

function generatePreviewText() {
    if (selectedTags.length === 0) return '';
    let text = '';
    selectedTags.forEach(key => {
        const parts = key.split(':');
        const module = parts[0];
        const category = parts[1];
        const tag = parts[2];
        const item = videoData[module]?.[category]?.[tag];
        if (item) {
            if (copyMode === 'en') {
                text += item.en + '\n';
            } else if (copyMode === 'cn') {
                text += item.cn + '\n';
            } else {
                text += `[${item.en}]\n${item.cn}\n\n`;
            }
        }
    });
    const custom = document.getElementById('customInput').value.trim();
    if (custom) {
        text += '\n' + custom;
    }
    const includeNegative = document.getElementById('includeNegative').checked;
    if (includeNegative) {
        const negative = document.getElementById('negativeInput').value.trim();
        if (negative) {
            text += '\n\n负面提示词:\n' + negative;
        }
    }
    return text;
}

function copyPrompt() {
    const text = generatePreviewText();
    if (!text) {
        showToast('❌ 请先选择提示词');
        return;
    }
    navigator.clipboard.writeText(text).then(() => {
        showToast('✅ 已复制到剪贴板');
    }).catch(err => {
        showToast('❌ 复制失败');
        console.error(err);
    });
}

function clearAll() {
    selectedTags = [];
    document.querySelectorAll('.prompt-tag.selected').forEach(el => el.classList.remove('selected'));
    document.getElementById('customInput').value = '';
    document.getElementById('negativeInput').value = '';
    updatePreview();
    updateStats();
    document.querySelectorAll('.tab-btn[data-module]').forEach(btn => {
        updateModuleBadge(btn.dataset.module);
    });
    showToast('🗑️ 已清空所有提示词');
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

function setupEventListeners() {
    document.getElementById('searchInput').addEventListener('input', function(e) {
        const query = e.target.value.toLowerCase();
        document.querySelectorAll('.prompt-tag').forEach(tag => {
            const text = tag.textContent.toLowerCase();
            if (text.includes(query)) {
                tag.classList.remove('hidden');
            } else {
                tag.classList.add('hidden');
            }
        });
    });
    document.getElementById('customInput').addEventListener('input', updatePreview);
    document.getElementById('includeNegative').addEventListener('change', updatePreview);
}
    </script>
</body>
</html>
