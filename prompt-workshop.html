<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文生图提示词工坊 Pro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }
        .container { max-width: 1600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        h1 { font-size: 2em; background: linear-gradient(90deg, #00d2ff, #7b2ff7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { color: #666; margin-top: 8px; font-size: 0.95em; }
        .main-content { display: flex; gap: 20px; align-items: flex-start; }
        @media (max-width: 1100px) { 
            .main-content { flex-direction: column; } 
            .result-panel { position: fixed !important; bottom: 0; left: 0; right: 0; top: auto !important; border-radius: 16px 16px 0 0; z-index: 100; max-height: 50vh; width: 100%; min-width: unset; } 
            .tabs-nav { flex-wrap: nowrap; overflow-x: auto; }
            .tab-panel { max-height: 50vh; }
        }
        .left-panel { flex: 1; min-width: 0; }
        .search-box { position: sticky; top: 0; z-index: 10; background: #0f0f1a; padding-bottom: 15px; }
        .search-input { width: 100%; padding: 12px 20px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 25px; color: #e0e0e0; font-size: 0.95em; transition: all 0.3s; }
        .search-input:focus { outline: none; border-color: #00d2ff; box-shadow: 0 0 15px rgba(0,210,255,0.2); }
        .tabs-container { display: flex; flex-direction: column; }
        .tabs-nav { display: flex; gap: 4px; padding: 6px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); overflow-x: auto; flex-wrap: wrap; margin-bottom: 12px; }
        .tabs-nav::-webkit-scrollbar { height: 4px; }
        .tabs-nav::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 2px; }
        .tabs-nav::-webkit-scrollbar-thumb { background: rgba(0,210,255,0.3); border-radius: 2px; }
        .tab-btn { padding: 8px 14px; background: transparent; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px; font-size: 0.85em; color: #888; white-space: nowrap; }
        .tab-btn:hover { background: rgba(0,210,255,0.1); color: #e0e0e0; }
        .tab-btn.active { background: linear-gradient(135deg, rgba(0,210,255,0.3), rgba(123,47,247,0.3)); color: #fff; box-shadow: 0 2px 8px rgba(0,210,255,0.3); }
        .tab-btn-icon { font-size: 1.1em; }
        .tab-btn-count { font-size: 0.75em; background: rgba(0,0,0,0.3); padding: 1px 6px; border-radius: 8px; }
        .tab-btn-selected { display: none; font-size: 0.7em; background: rgba(80,200,120,0.8); padding: 1px 5px; border-radius: 6px; color: #fff; }
        .tab-btn-selected.visible { display: inline-flex; }
        .tab-content { background: rgba(255,255,255,0.03); border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; }
        .tab-panel { display: none; padding: 14px; max-height: 600px; overflow-y: auto; }
        .tab-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: rgba(0,210,255,0.05); border-radius: 8px; margin-bottom: 12px; border: 1px solid rgba(0,210,255,0.1); }
        .tab-panel-title { font-size: 0.9em; color: #00d2ff; font-weight: 500; }
        .tab-clear-btn { padding: 4px 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; color: #888; font-size: 0.78em; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 5px; }
        .tab-clear-btn:hover { background: rgba(255,80,80,0.3); color: #ff5050; }
        .tab-clear-btn.has-items { background: rgba(80,200,120,0.2); border-color: rgba(80,200,120,0.3); color: #50c878; }
        .clear-count { background: rgba(0,0,0,0.3); padding: 1px 6px; border-radius: 10px; font-size: 0.9em; min-width: 18px; text-align: center; }
        .tab-panel.active { display: block; }
        .tab-panel::-webkit-scrollbar { width: 5px; }
        .tab-panel::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
        .tab-panel::-webkit-scrollbar-thumb { background: rgba(0,210,255,0.3); border-radius: 3px; }
        .module { margin-bottom: 10px; }
        .module:last-child { margin-bottom: 0; }
        .module-header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.02); cursor: pointer; user-select: none; border-radius: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .module-header:hover { background: rgba(0,210,255,0.05); }
        .module-icon { font-size: 1em; }
        .module-title { font-size: 0.9em; font-weight: 600; color: #00d2ff; flex: 1; }
        .module-count { font-size: 0.7em; color: #666; background: rgba(0,0,0,0.3); padding: 2px 6px; border-radius: 6px; }
.module-count-selected { font-size: 0.7em; color: #4caf50; background: rgba(76,175,80,0.15); padding: 2px 6px; border-radius: 6px; display: none; font-weight: 700; }
.module-count-selected.has-selected { display: inline; }
.module-count-selected::before { content: '✓ '; }
        .module-arrow { color: #666; transition: transform 0.3s; font-size: 0.7em; }
        .module-arrow.collapsed { transform: rotate(-90deg); }
        .module-body { padding: 8px 12px; max-height: 400px; overflow-y: auto; transition: max-height 0.4s; }
        .module-body.collapsed { max-height: 0; padding: 0 12px; overflow: hidden; }
        .module-body::-webkit-scrollbar { width: 5px; }
        .module-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
        .module-body::-webkit-scrollbar-thumb { background: rgba(0,210,255,0.3); border-radius: 3px; }
        .category { margin-bottom: 10px; }
        .category:last-child { margin-bottom: 0; }
        .category-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; padding: 6px 10px; background: rgba(123,47,247,0.1); border-radius: 6px; cursor: pointer; user-select: none; }
        .category-header:hover { background: rgba(123,47,247,0.15); }
        .category-dot { width: 6px; height: 6px; background: #7b2ff7; border-radius: 50%; }
        .category-name { font-size: 0.85em; font-weight: 500; color: #c4a0ff; flex: 1; }
        .category-arrow { color: #666; transition: transform 0.3s; font-size: 0.7em; }
        .category-arrow.collapsed { transform: rotate(-90deg); }
        .tags-container { display: flex; flex-wrap: wrap; gap: 5px; padding-left: 16px; max-height: 350px; overflow-y: auto; transition: max-height 0.3s; }
        .tags-container.collapsed { max-height: 0; overflow: hidden; }
        .tags-container::-webkit-scrollbar { width: 4px; }
        .tags-container::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 2px; }
        .tags-container::-webkit-scrollbar-thumb { background: rgba(123,47,247,0.3); border-radius: 2px; }
        .prompt-tag { padding: 4px 10px; background: rgba(0,210,255,0.08); border: 1px solid rgba(0,210,255,0.2); border-radius: 12px; cursor: pointer; transition: all 0.2s; font-size: 0.82em; user-select: none; white-space: nowrap; }
        .prompt-tag:hover { background: rgba(0,210,255,0.15); transform: translateY(-1px); }
        .prompt-tag.selected { background: linear-gradient(135deg, rgba(0,210,255,0.3), rgba(123,47,247,0.3)); border-color: #00d2ff; box-shadow: 0 0 8px rgba(0,210,255,0.3); }
        .prompt-tag.hidden { display: none; }
        .scaffold-card { background: linear-gradient(135deg, rgba(0,210,255,0.05), rgba(123,47,247,0.05)); border: 2px solid rgba(0,210,255,0.2); border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .scaffold-card:hover { border-color: #00d2ff; transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,210,255,0.3); }
        .scaffold-card.hidden { display: none; }
        .scaffold-card.selected { border-color: #50c878; background: linear-gradient(135deg, rgba(80,200,120,0.15), rgba(0,210,255,0.15)); box-shadow: 0 0 20px rgba(80,200,120,0.5), inset 0 0 20px rgba(80,200,120,0.1); transform: translateY(-3px); }
        .scaffold-card.selected::after { content: '✓ 已选中'; position: absolute; top: 10px; right: 10px; background: linear-gradient(135deg, #50c878, #3da862); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.75em; font-weight: bold; box-shadow: 0 2px 8px rgba(80,200,120,0.5); z-index: 10; }
        .scaffold-card .card-del-btn { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; background: rgba(255,60,60,0.85); border: none; border-radius: 50%; color: #fff; font-size: 0.8em; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 15; transition: all 0.2s; opacity: 0; }
        .scaffold-card:hover .card-del-btn { opacity: 1; }
        .scaffold-card .card-del-btn:hover { background: rgba(255,30,30,1); transform: scale(1.15); }
        .scaffold-card .card-prompt-body { margin-top: 8px; padding: 6px 8px; background: rgba(0,0,0,0.25); border-radius: 6px; font-size: 0.72em; color: #aaa; line-height: 1.5; max-height: 60px; overflow-y: auto; word-wrap: break-word; }
        .scaffold-card .card-prompt-body::-webkit-scrollbar { width: 3px; }
        .scaffold-card .card-prompt-body::-webkit-scrollbar-thumb { background: rgba(0,210,255,0.2); border-radius: 2px; }
        .scaffold-card-image { width: 100%; height: 100px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; background: rgba(0,0,0,0.3); }
        .scaffold-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
        .scaffold-card-icon { font-size: 1.2em; }
        .scaffold-card-title { font-size: 0.9em; font-weight: 600; color: #00d2ff; }
        .scaffold-card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
        .scaffold-tag { padding: 2px 8px; background: rgba(0,210,255,0.1); border-radius: 10px; font-size: 0.72em; color: #888; }
        .scaffold-card-footer { margin-top: 8px; font-size: 0.7em; color: #666; display: flex; align-items: center; gap: 4px; }
        .scaffold-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .result-panel { width: 340px; min-width: 340px; background: rgba(255,255,255,0.03); border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); padding: 16px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; }
        .result-panel::-webkit-scrollbar { width: 5px; }
        .result-panel::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 3px; }
        .result-panel::-webkit-scrollbar-thumb { background: rgba(0,210,255,0.3); border-radius: 3px; }
        .result-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .result-title { font-size: 1em; font-weight: 600; color: #00d2ff; }
        .copy-mode-toggle { display: flex; background: rgba(0,0,0,0.3); border-radius: 6px; padding: 2px; }
        .copy-mode-btn { padding: 4px 10px; border: none; background: transparent; color: #888; cursor: pointer; border-radius: 4px; font-size: 0.78em; transition: all 0.2s; }
        .copy-mode-btn.active { background: rgba(0,210,255,0.3); color: #00d2ff; }
        .result-area { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 12px; max-height: 180px; overflow-y: auto; font-size: 0.85em; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; }
        .result-area::-webkit-scrollbar { width: 4px; }
        .result-area::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 2px; }
        .result-area::-webkit-scrollbar-thumb { background: rgba(0,210,255,0.3); border-radius: 2px; }
        .result-empty { color: #555; font-style: italic; }
        .selected-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; max-height: 90px; overflow-y: auto; }
        .selected-tag { padding: 3px 7px; background: rgba(0,210,255,0.2); border-radius: 8px; font-size: 0.75em; display: flex; align-items: center; gap: 4px; }
        .selected-tag .remove { cursor: pointer; opacity: 0.6; }
        .selected-tag .remove:hover { opacity: 1; }
        .result-stats { font-size: 0.78em; color: #666; margin-bottom: 10px; }
        .result-actions { display: flex; gap: 8px; }
        .btn { flex: 1; padding: 9px 12px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85em; font-weight: 600; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-primary { background: linear-gradient(135deg, #00d2ff, #7b2ff7); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,210,255,0.4); }
        .btn-secondary { background: rgba(255,255,255,0.08); color: #e0e0e0; border: 1px solid rgba(255,255,255,0.15); }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .custom-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
        .custom-label { display: block; margin-bottom: 6px; color: #888; font-size: 0.82em; }
        .custom-textarea { width: 100%; padding: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #e0e0e0; font-size: 0.82em; resize: vertical; min-height: 50px; max-height: 100px; }
        .custom-textarea:focus { outline: none; border-color: #00d2ff; }
        .negative-section { margin-top: 14px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.08); }
        .negative-toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; margin-bottom: 6px; }
        .negative-toggle input { display: none; }
        .toggle-switch { width: 34px; height: 18px; background: rgba(255,255,255,0.1); border-radius: 9px; position: relative; transition: all 0.3s; flex-shrink: 0; }
        .toggle-switch::after { content: ''; position: absolute; width: 14px; height: 14px; background: #666; border-radius: 50%; top: 2px; left: 2px; transition: all 0.3s; }
        .negative-toggle input:checked + .toggle-switch { background: rgba(255,80,80,0.4); }
        .negative-toggle input:checked + .toggle-switch::after { left: 18px; background: #ff5050; }
        .negative-text { font-size: 0.82em; color: #888; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: linear-gradient(135deg, #00d2ff, #7b2ff7); color: white; padding: 12px 24px; border-radius: 8px; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 1000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        /* 保存模板模态框 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-overlay.show { display: flex; }
        .modal-dialog { background: linear-gradient(135deg, #1a1a2e, #2a1a3e); border: 1px solid rgba(0,210,255,0.2); border-radius: 16px; padding: 28px; width: 420px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
        .modal-title { font-size: 1.1em; font-weight: 600; color: #00d2ff; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .modal-field { margin-bottom: 16px; }
        .modal-label { display: block; color: #888; font-size: 0.85em; margin-bottom: 6px; }
        .modal-input { width: 100%; padding: 10px 14px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; color: #e0e0e0; font-size: 0.9em; transition: border-color 0.3s; }
        .modal-input:focus { outline: none; border-color: #00d2ff; box-shadow: 0 0 10px rgba(0,210,255,0.15); }
        .modal-input::placeholder { color: #555; }
        .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
        .modal-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9em; font-weight: 600; transition: all 0.2s; }
        .modal-btn-primary { background: linear-gradient(135deg, #00d2ff, #7b2ff7); color: #fff; }
        .modal-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,210,255,0.3); }
        .modal-btn-secondary { background: rgba(255,255,255,0.08); color: #e0e0e0; border: 1px solid rgba(255,255,255,0.15); }
        .modal-btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .modal-hint { font-size: 0.78em; color: #666; margin-top: 4px; }
        .modal-preview { margin-top: 10px; display: none; }
        .modal-preview.show { display: block; }
        .modal-preview img { width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        
        /* 多行筛选导航组件样式 */
        .filter-nav {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
            padding: 12px;
            margin-bottom: 15px;
        }
        .filter-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .filter-row:last-child {
            border-bottom: none;
        }
        .filter-label {
            font-size: 0.82em;
            color: #888;
            min-width: 60px;
            white-space: nowrap;
            padding-top: 4px;
        }
        .filter-options {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: 1;
        }
        .filter-option {
            font-size: 0.82em;
            color: #ccc;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            white-space: nowrap;
        }
        .filter-option:hover {
            color: #00d2ff;
            background: rgba(0,210,255,0.1);
        }
        .filter-option.active {
            color: #00d2ff;
            font-weight: 500;
            background: rgba(0,210,255,0.15);
        }
        .filter-more {
            font-size: 0.78em;
            color: #888;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .filter-more:hover {
            color: #00d2ff;
        }
        .filter-more::after {
            content: ' ▾';
        }
        .filter-more.expanded::after {
            content: ' ▴';
        }
        .filter-extra {
            display: none;
        }
        .filter-extra.show {
            display: flex;
        }
        .filter-option .selected-count {
            color: #4caf50;
            font-weight: 700;
            font-size: 0.82em;
        }
        .filter-option.active .selected-count {
            color: #66ff66;
        }
    </style>
    <script src="https://unpkg.com/js-yaml@4/dist/js-yaml.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 文生图提示词工坊 Pro</h1>
            <p class="subtitle">1000+ 精细提示词 | 多级分类 | 中英文切换复制</p>
        </header>
        <div class="main-content">
            <div class="left-panel">
                <div class="search-box">
                    <input type="text" class="search-input" placeholder="🔍 搜索提示词（支持中英文）..." id="searchInput">
                </div>
                <!-- 多行筛选导航区域 -->
                <div class="filter-nav" id="filterNav">
                    <!-- 动态生成筛选行 -->
                </div>
                <div class="modules-grid" id="modulesContainer"></div>
            </div>
            <div class="result-panel">
                <div class="result-header">
                    <span class="result-title">📝 生成的提示词</span>
                    <div class="copy-mode-toggle">
                        <button class="copy-mode-btn" data-mode="en" onclick="setCopyMode('en')">English</button>
                        <button class="copy-mode-btn active" data-mode="cn" onclick="setCopyMode('cn')">中文</button>
                        <button class="copy-mode-btn" data-mode="both" onclick="setCopyMode('both')">双语</button>
                    </div>
                </div>
                <div class="result-area" id="resultArea">
                    <span class="result-empty">请从左侧选择提示词...</span>
                </div>
                <div class="selected-tags" id="selectedTags"></div>
                <div class="result-stats" id="resultStats">已选择: 0 个提示词</div>
                <div class="result-actions">
                    <button class="btn btn-primary" onclick="copyPrompt()"><span>📋</span> 复制</button>
                    <button class="btn btn-secondary" onclick="clearAll()"><span>🗑️</span> 清空</button>
                    <button class="btn btn-secondary" onclick="openSaveModal()" style="flex:0.6;"><span>💾</span> 存模板</button>
                </div>
                <div class="custom-section">
                    <label class="custom-label">自定义提示词（将添加到末尾）</label>
                    <textarea class="custom-textarea" id="customInput" placeholder="输入自定义提示词..."></textarea>
                </div>
                <div class="negative-section">
                    <label class="negative-toggle">
                        <input type="checkbox" id="includeNegative">
                        <span class="toggle-switch"></span>
                        <span class="negative-text">添加负面提示词</span>
                    </label>
                    <textarea class="custom-textarea" id="negativeInput" placeholder="负面提示词（如：low quality, blurry, deformed）"></textarea>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <!-- 保存模板模态框 -->
    <div class="modal-overlay" id="saveModal" onclick="if(event.target===this)closeSaveModal()">

    <!-- 自定义模板数据，独立于 prompt-data.yaml -->
    <script type="text/yaml" id="yamlSelfData">
    </script>

<script>

let promptData = {};
let selectedPrompts = [];
let copyMode = 'cn';
let moduleSelectedCount = {};
let scaffoldData = [];
let userTemplates = [];

// 多行筛选导航状态
let filterState = {
    selectedLevel1: null,   // 选中的一级分类
    selectedLevel2: null,   // 选中的二级分类
    expandedRows: new Set() // 展开的行
};

// 构建层级数据结构
function buildHierarchy(data) {
    const hierarchy = [];
    
    // 一级分类
    for (const [level1Key, level1Value] of Object.entries(data)) {
        const level1 = {
            id: level1Key,
            name: level1Key,
            icon: level1Key.match(/^[\u{1F300}-\u{1F9FF}]/u)?.[0] || '📁',
            children: []
        };
        
        // 快捷脚手架：二级分类下的三级模板
        if (level1Key === '🚀 快捷脚手架') {
            // 二级分类
            for (const [level2Key, level2Value] of Object.entries(level1Value)) {
                const level2 = {
                    id: level2Key,
                    name: level2Key,
                    icon: level2Key.match(/^[\u{1F300}-\u{1F9FF}]/u)?.[0] || '📁',
                    children: []
                };
                
                // 三级：模板数据 (level3 = template with en/cn data)
                for (const [level3Key, level3Value] of Object.entries(level2Value)) {
                    level2.children.push({
                        id: level3Key,
                        name: level3Key,
                        icon: level3Key.match(/^[\u{1F300}-\u{1F9FF}]/u)?.[0] || '📄',
                        data: level3Value
                    });
                }
                
                level1.children.push(level2);
            }
        } else {
            // 其他分类：二级分类
            for (const [level2Key, level2Value] of Object.entries(level1Value)) {
                const level2 = {
                    id: level2Key,
                    name: level2Key,
                    icon: level2Key.match(/^[\u{1F300}-\u{1F9FF}]/u)?.[0] || '📁',
                    children: []
                };
                
                // 三级分类（如果有）
                if (typeof level2Value === 'object' && !level2Value.en && !level2Value.cn) {
                    for (const [level3Key, level3Value] of Object.entries(level2Value)) {
                        level2.children.push({
                            id: level3Key,
                            name: level3Key,
                            icon: level3Key.match(/^[\u{1F300}-\u{1F9FF}]/u)?.[0] || '📄',
                            data: level3Value
                        });
                    }
                } else {
                    // 没有三级，直接是标签数据
                    level2.data = level2Value;
                }
                
                level1.children.push(level2);
            }
        }
        
        hierarchy.push(level1);
    }
    
    return hierarchy;
}

// 计算节点下的标签总数
function countTags(node) {
    let count = 0;
    if (node.data && node.data.en) {
        count = 1;
    }
    if (node.children) {
        node.children.forEach(child => {
            count += countTags(child);
        });
    }
    return count;
}

// 渲染多行筛选导航
function renderFilterNav() {
    const container = document.getElementById('filterNav');
    container.innerHTML = '';
    
    const hierarchy = buildHierarchy(promptData);
    
    // 第一行：一级分类
    const row1 = document.createElement('div');
    row1.className = 'filter-row';
    
    const label1 = document.createElement('span');
    label1.className = 'filter-label';
    label1.textContent = '分类：';
    row1.appendChild(label1);
    
    const options1 = document.createElement('div');
    options1.className = 'filter-options';
    
    // "全部"选项
    const allOption = document.createElement('span');
    allOption.className = `filter-option ${!filterState.selectedLevel1 ? 'active' : ''}`;
    allOption.textContent = '全部';
    allOption.onclick = () => selectLevel1(null);
    options1.appendChild(allOption);
    
    // 显示前8个一级分类
    const visibleItems1 = hierarchy.slice(0, 8);
    const extraItems1 = hierarchy.slice(8);
    
    visibleItems1.forEach(item => {
        const option = document.createElement('span');
        option.className = `filter-option ${filterState.selectedLevel1 === item.id ? 'active' : ''}`;
        option.textContent = item.name;
        option.onclick = () => selectLevel1(item);
        options1.appendChild(option);
    });
    
    // 如果有更多，显示"更多"按钮
    if (extraItems1.length > 0) {
        const moreBtn = document.createElement('span');
        moreBtn.className = `filter-more ${filterState.expandedRows.has('level1') ? 'expanded' : ''}`;
        moreBtn.textContent = `更多${extraItems1.length}项`;
        moreBtn.onclick = () => toggleRow('level1');
        options1.appendChild(moreBtn);
        
        // 额外选项容器
        const extraContainer = document.createElement('div');
        extraContainer.className = `filter-options filter-extra ${filterState.expandedRows.has('level1') ? 'show' : ''}`;
        extraContainer.id = 'level1-extra';
        
        extraItems1.forEach(item => {
            const option = document.createElement('span');
            option.className = `filter-option ${filterState.selectedLevel1 === item.id ? 'active' : ''}`;
            option.textContent = item.name;
            option.onclick = () => selectLevel1(item);
            extraContainer.appendChild(option);
        });
        
        options1.appendChild(extraContainer);
    }
    
    row1.appendChild(options1);
    container.appendChild(row1);
    
    // 第二行：二级分类（如果选中了一级分类）
    if (filterState.selectedLevel1) {
        const selectedLevel1 = hierarchy.find(item => item.id === filterState.selectedLevel1);
        if (selectedLevel1 && selectedLevel1.children.length > 0) {
            const row2 = document.createElement('div');
            row2.className = 'filter-row';
            
            const label2 = document.createElement('span');
            label2.className = 'filter-label';
            label2.textContent = '子类：';
            row2.appendChild(label2);
            
            const options2 = document.createElement('div');
            options2.className = 'filter-options';
            
            // "全部"选项
            const allOption2 = document.createElement('span');
            allOption2.className = `filter-option ${!filterState.selectedLevel2 ? 'active' : ''}`;
            allOption2.textContent = '全部';
            allOption2.onclick = () => selectLevel2(null);
            options2.appendChild(allOption2);
            
            // 显示前10个二级分类
            const visibleItems2 = selectedLevel1.children.slice(0, 10);
            const extraItems2 = selectedLevel1.children.slice(10);
            
            visibleItems2.forEach(item => {
                const option = document.createElement('span');
                option.className = `filter-option ${filterState.selectedLevel2 === item.id ? 'active' : ''}`;
                option.dataset.level2Key = item.id;
                // 计算此子类模块中的选中标签数
                const moduleKey = `${filterState.selectedLevel1}|${item.id}`;
                const moduleEl = document.querySelector(`.module[data-module-key="${moduleKey}"]`);
                const count = moduleEl ? moduleEl.querySelectorAll('.prompt-tag.selected').length : 0;
                option.innerHTML = count > 0 
                    ? `${item.name} <span class="selected-count">${count}</span>` 
                    : item.name;
                option.onclick = () => selectLevel2(item);
                options2.appendChild(option);
            });
            
            // 如果有更多，显示"更多"按钮
            if (extraItems2.length > 0) {
                const moreBtn2 = document.createElement('span');
                moreBtn2.className = `filter-more ${filterState.expandedRows.has('level2') ? 'expanded' : ''}`;
                moreBtn2.textContent = `更多${extraItems2.length}项`;
                moreBtn2.onclick = () => toggleRow('level2');
                options2.appendChild(moreBtn2);
                
                // 额外选项容器
                const extraContainer2 = document.createElement('div');
                extraContainer2.className = `filter-options filter-extra ${filterState.expandedRows.has('level2') ? 'show' : ''}`;
                extraContainer2.id = 'level2-extra';
                
                extraItems2.forEach(item => {
                    const option = document.createElement('span');
                    option.className = `filter-option ${filterState.selectedLevel2 === item.id ? 'active' : ''}`;
                    option.dataset.level2Key = item.id;
                    // 计算此子类模块中的选中标签数
                    const moduleKey = `${filterState.selectedLevel1}|${item.id}`;
                    const moduleEl = document.querySelector(`.module[data-module-key="${moduleKey}"]`);
                    const count = moduleEl ? moduleEl.querySelectorAll('.prompt-tag.selected').length : 0;
                    option.innerHTML = count > 0 
                        ? `${item.name} <span class="selected-count">${count}</span>` 
                        : item.name;
                    option.onclick = () => selectLevel2(item);
                    extraContainer2.appendChild(option);
                });
                
                options2.appendChild(extraContainer2);
            }
            
            row2.appendChild(options2);
            container.appendChild(row2);
        }
    }
}

// 展开/收起行
function toggleRow(rowId) {
    if (filterState.expandedRows.has(rowId)) {
        filterState.expandedRows.delete(rowId);
    } else {
        filterState.expandedRows.add(rowId);
    }
    renderFilterNav();
}

// 选择一级分类
function selectLevel1(item) {
    filterState.selectedLevel1 = item ? item.id : null;
    filterState.selectedLevel2 = null; // 重置二级分类
    renderFilterNav();
    applyFilterNav();
}

// 选择二级分类
function selectLevel2(item) {
    filterState.selectedLevel2 = item ? item.id : null;
    renderFilterNav();
    applyFilterNav();
}

// 重置筛选
function resetFilterNav() {
    filterState.selectedLevel1 = null;
    filterState.selectedLevel2 = null;
    filterState.expandedRows.clear();
    renderFilterNav();
    applyFilterNav();
}

// 应用筛选导航
function applyFilterNav() {
    const allModules = document.querySelectorAll('.module');
    const allTags = document.querySelectorAll('.prompt-tag');
    const allScaffoldCards = document.querySelectorAll('.scaffold-card');
    
    // 如果没有选择任何筛选条件，显示所有
    if (!filterState.selectedLevel1 && !filterState.selectedLevel2) {
        allModules.forEach(module => module.style.display = '');
        allTags.forEach(tag => tag.classList.remove('hidden'));
        allScaffoldCards.forEach(card => card.classList.remove('hidden'));
        return;
    }
    
    // 构建层级数据
    const hierarchy = buildHierarchy(promptData);
    
    // 收集所有匹配的标签
    const matchedTags = new Set();
    
    // 递归收集匹配的数据
    function collectMatches(node) {
        if (node.data && node.data.en) {
            matchedTags.add(node.name);
        }
        if (node.children) {
            node.children.forEach(child => collectMatches(child));
        }
    }
    
    // 根据筛选条件收集匹配项
    if (filterState.selectedLevel1) {
        const level1Item = hierarchy.find(item => item.id === filterState.selectedLevel1);
        if (level1Item) {
            if (filterState.selectedLevel2) {
                // 选中了一级和二级分类
                const level2Item = level1Item.children.find(item => item.id === filterState.selectedLevel2);
                if (level2Item) {
                    collectMatches(level2Item);
                }
            } else {
                // 只选中了一级分类
                collectMatches(level1Item);
            }
        }
    }
    
    // 应用筛选
    allTags.forEach(tag => {
        const tagName = tag.dataset.cn || tag.textContent;
        if (matchedTags.has(tagName)) {
            tag.classList.remove('hidden');
        } else {
            tag.classList.add('hidden');
        }
    });
    
    allScaffoldCards.forEach(card => {
        const cardTitle = card.querySelector('.scaffold-card-title');
        if (cardTitle && matchedTags.has(cardTitle.textContent)) {
            card.classList.remove('hidden');
        } else {
            card.classList.add('hidden');
        }
    });
    
    // 显示/隐藏模块 - 使用 data-level1 属性进行模块级过滤
    allModules.forEach(module => {
        const moduleLevel1 = module.dataset.level1;
        
        // 如果选中了一级分类，只显示属于该分类的模块
        if (filterState.selectedLevel1 && moduleLevel1 !== filterState.selectedLevel1) {
            module.style.display = 'none';
            return;
        }
        
        // 对于属于选中分类的模块，根据标签/卡片可见性决定是否显示
        const visibleTags = module.querySelectorAll('.prompt-tag:not(.hidden)');
        const visibleCards = module.querySelectorAll('.scaffold-card:not(.hidden)');
        if (visibleTags.length > 0 || visibleCards.length > 0) {
            module.style.display = '';
        } else {
            module.style.display = 'none';
        }
    });
}

// 从 yamlSelfData 加载初始数据，再与 localStorage 合并
function loadUserTemplates() {
    userTemplates = [];
    try {
        const el = document.getElementById('yamlSelfData');
        if (el && el.textContent.trim()) {
            const parsed = jsyaml.load(el.textContent);
            if (parsed && Array.isArray(parsed.自定义模板)) {
                userTemplates = parsed.自定义模板;
            }
        }
    } catch (e) {
        console.warn('Failed to load yamlSelfData:', e);
    }
    try {
        const saved = localStorage.getItem('userPromptTemplates');
        if (saved) {
            const localData = JSON.parse(saved);
            if (Array.isArray(localData)) {
                // 合并：localStorage 覆盖 yaml 中的同名模板
                const existingNames = new Map(userTemplates.map(t => [t.name, t]));
                for (const tpl of localData) {
                    existingNames.set(tpl.name, tpl);
                }
                userTemplates = Array.from(existingNames.values());
            }
        }
    } catch (e) {
        console.warn('Failed to merge localStorage templates:', e);
    }
}

function saveUserTemplates() {
    try {
        localStorage.setItem('userPromptTemplates', JSON.stringify(userTemplates));
    } catch (e) {
        console.warn('Failed to save user templates:', e);
    }
}

// 初始化脚手架数据
function initScaffoldData() {
    scaffoldData = [];
    const scaffoldCategories = promptData["🚀 快捷脚手架"];
    for (const [catName, prompts] of Object.entries(scaffoldCategories)) {
        for (const [name, data] of Object.entries(prompts)) {
            scaffoldData.push({ name, cn: data.cn, en: data.en, category: catName, userTemplate: false });
        }
    }
    // 合并用户自定义模板
    loadUserTemplates();
    for (const tpl of userTemplates) {
        scaffoldData.push({
            name: tpl.name,
            cn: tpl.cn,
            en: tpl.en,
            category: '📌 自定义模板',
            userTemplate: true,
            imageUrl: tpl.imageUrl || '',
            description: tpl.description || ''
        });
    }
}

let selectedScaffoldIndex = -1; // 当前选中的脚手架索引

function applyScaffoldByIndex(index) {
    if (index >= 0 && index < scaffoldData.length) {
        const item = scaffoldData[index];
        
        // Toggle效果：如果点击已选中的，则取消选中
        if (selectedScaffoldIndex === index) {
            // 取消选中
            document.querySelectorAll(`.scaffold-card[data-idx="${index}"]`).forEach(card => {
                card.classList.remove('selected');
            });
            selectedScaffoldIndex = -1;
            
            // 清空提示词
            selectedPrompts = [];
            
            // 更新徽章
            const tabId = 'tab-🚀-快捷脚手架';
            moduleSelectedCount[tabId] = 0;
            updateModuleBadge(tabId);
            
            updateResult();
            showToast('已取消选择');
            return;
        }
        
        // 选中新模板
        document.querySelectorAll('.scaffold-card').forEach(card => {
            card.classList.remove('selected');
        });
        document.querySelectorAll(`.scaffold-card[data-idx="${index}"]`).forEach(card => {
            card.classList.add('selected');
        });
        selectedScaffoldIndex = index;
        
        // 更新徽章
        const tabId = 'tab-🚀-快捷脚手架';
        moduleSelectedCount[tabId] = 1;
        updateModuleBadge(tabId);
        
        applyScaffold(item.en, item.cn);
    }
}

function clearModulePrompts(tabId) {
    // 处理"全部"Tab
    if (tabId === 'tab-all') {
        // 清除所有选中的标签
        document.querySelectorAll('.prompt-tag.selected').forEach(tag => {
            tag.classList.remove('selected');
        });
        // 清除脚手架选中状态
        document.querySelectorAll('.scaffold-card.selected').forEach(card => {
            card.classList.remove('selected');
        });
        selectedScaffoldIndex = -1;
        selectedPrompts = [];
        
        // 重置所有模块计数
        Object.keys(moduleSelectedCount).forEach(key => {
            moduleSelectedCount[key] = 0;
            updateModuleBadge(key);
        });
        
        updateResult();
        showToast('已清空所有选择');
        return;
    }
    
    // 处理快捷脚手架模块
    if (tabId === 'tab-🚀-快捷脚手架') {
        const selectedCard = document.querySelector(`#${tabId} .scaffold-card.selected`);
        if (!selectedCard) {
            showToast('当前模块没有已选提示词');
            return;
        }
        selectedCard.classList.remove('selected');
        selectedScaffoldIndex = -1;
        selectedPrompts = [];
        moduleSelectedCount[tabId] = 0;
        updateModuleBadge(tabId);
        updateResult();
        showToast('已清除快捷脚手架');
        return;
    }
    
    // 处理其他模块
    const moduleTags = document.querySelectorAll(`#${tabId} .prompt-tag.selected`);
    if (moduleTags.length === 0) {
        showToast('当前模块没有已选提示词');
        return;
    }
    
    moduleTags.forEach(tag => {
        tag.classList.remove('selected');
        const cn = tag.dataset.cn;
        selectedPrompts = selectedPrompts.filter(p => p.cn !== cn);
    });
    
    moduleSelectedCount[tabId] = 0;
    updateModuleBadge(tabId);
    updateResult();
    showToast(`已清除此模块的 ${moduleTags.length} 个提示词`);
}

function switchTab(tabId) {
    // 更新按钮状态
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tabId);
    });
    
    // 更新面板状态
    document.querySelectorAll('.tab-panel').forEach(panel => {
        panel.classList.toggle('active', panel.id === tabId);
    });
}

function toggleModule(header) {
    const body = header.nextElementSibling;
    const arrow = header.querySelector('.module-arrow');
    body.classList.toggle('collapsed');
    arrow.classList.toggle('collapsed');
}

function togglePrompt(element, cn, tabId) {
    element.classList.toggle('selected');
    
    if (selectedPrompts.find(p => p.cn === cn)) {
        selectedPrompts = selectedPrompts.filter(p => p.cn !== cn);
        if (tabId && moduleSelectedCount[tabId]) {
            moduleSelectedCount[tabId]--;
        }
    } else {
        selectedPrompts.push({
            cn: cn,
            en: element.dataset.en
        });
        if (tabId) {
            moduleSelectedCount[tabId] = (moduleSelectedCount[tabId] || 0) + 1;
        }
    }
    
    // 更新父模块的选中计数徽章
    const moduleEl = element.closest('.module');
    if (moduleEl) {
        const key = moduleEl.dataset.moduleKey;
        if (key) {
            // 重新计算此模块下选中的标签数
            const selectedInModule = moduleEl.querySelectorAll('.prompt-tag.selected').length;
            moduleSelectedCount[key] = selectedInModule;
            const badge = moduleEl.querySelector('.module-count-selected');
            if (badge) {
                badge.textContent = selectedInModule > 0 ? `${selectedInModule}` : '';
                badge.classList.toggle('has-selected', selectedInModule > 0);
            }
        }
    }
    
    if (tabId) {
        updateModuleBadge(tabId);
    }
    updateResult();
    // 更新筛选导航栏二级选项的选中计数
    updateLevel2Counts();
}

function applyScaffold(enText, cnText) {
    // 清空当前选择的标签
    document.querySelectorAll('.prompt-tag.selected').forEach(tag => {
        tag.classList.remove('selected');
    });
    selectedPrompts = [];
    
    // 重置除快捷脚手架外的模块计数
    Object.keys(moduleSelectedCount).forEach(key => {
        if (key !== 'tab-🚀-快捷脚手架') {
            moduleSelectedCount[key] = 0;
            updateModuleBadge(key);
        }
    });
    
    // 重置所有模块的选中计数徽章
    document.querySelectorAll('.module-count-selected').forEach(badge => {
        badge.textContent = '';
        badge.classList.remove('has-selected');
    });
    
    // 解析并添加新的提示词
    const enTags = enText.split(', ');
    const cnTags = cnText.split('，');
    
    // 使用中文标签
    cnTags.forEach((cn, index) => {
        const en = enTags[index] || cnTags[index];
        selectedPrompts.push({ cn, en });
    });
    
    // 更新结果
    updateResult();
    showToast(`已应用模板: ${cnText.split('，')[0]}...`);
}

function updateModuleBadge(tabId) {
    const count = moduleSelectedCount[tabId] || 0;
    
    // 更新tab按钮上的徽章
    const badge = document.getElementById(`${tabId}-badge`);
    if (badge) {
        badge.textContent = count;
        badge.classList.toggle('visible', count > 0);
    }
    
    // 更新清除按钮上的数量
    const clearBtn = document.getElementById(`${tabId}-clear-btn`);
    if (clearBtn) {
        const countSpan = clearBtn.querySelector('.clear-count');
        if (countSpan) {
            countSpan.textContent = count;
        }
        // 根据数量调整按钮样式
        clearBtn.classList.toggle('has-items', count > 0);
    }
}

// 更新所有模块的选中计数徽章
function updateAllModuleBadges() {
    document.querySelectorAll('.module').forEach(module => {
        const badge = module.querySelector('.module-count-selected');
        if (!badge) return;
        const selectedCount = module.querySelectorAll('.prompt-tag.selected').length;
        if (selectedCount > 0) {
            badge.textContent = selectedCount;
            badge.classList.add('has-selected');
        } else {
            badge.textContent = '';
            badge.classList.remove('has-selected');
        }
    });
    // 同时更新筛选导航栏的二级计数
    updateLevel2Counts();
}

// 更新筛选导航栏中二级选项的选中计数
function updateLevel2Counts() {
    if (!filterState.selectedLevel1) return;
    const level2Options = document.querySelectorAll('.filter-option[data-level2-key]');
    level2Options.forEach(option => {
        const level2Key = option.dataset.level2Key;
        if (!level2Key) return;
        const moduleKey = `${filterState.selectedLevel1}|${level2Key}`;
        const moduleEl = document.querySelector(`.module[data-module-key="${moduleKey}"]`);
        const count = moduleEl ? moduleEl.querySelectorAll('.prompt-tag.selected').length : 0;
        const nameText = option.childNodes[0]?.textContent || level2Key;
        if (count > 0) {
            option.innerHTML = `${nameText} <span class="selected-count">${count}</span>`;
        } else {
            // 只保留文本，移除计数
            const text = option.textContent.replace(/\s*\d+$/, '');
            option.textContent = level2Key;
        }
    });
}

function updateResult() {
    const resultArea = document.getElementById('resultArea');
    const selectedTags = document.getElementById('selectedTags');
    const resultStats = document.getElementById('resultStats');
    const customInput = document.getElementById('customInput').value.trim();
    const negativeInput = document.getElementById('negativeInput').value.trim();
    const includeNegative = document.getElementById('includeNegative').checked;
    
    let allPrompts = [...selectedPrompts];
    
    let displayText = '';
    if (copyMode === 'en') {
        displayText = allPrompts.map(p => p.en).join(', ');
    } else if (copyMode === 'cn') {
        displayText = allPrompts.map(p => p.cn).join(', ');
    } else {
        displayText = allPrompts.map(p => `${p.cn} (${p.en})`).join(', ');
    }
    
    if (customInput) {
        displayText += (displayText ? ', ' : '') + customInput;
    }
    
    if (includeNegative && negativeInput) {
        displayText += '\n\nNegative prompt: ' + negativeInput;
    }
    
    if (displayText) {
        resultArea.textContent = displayText;
    } else {
        resultArea.innerHTML = '<span class="result-empty">请从左侧选择提示词...</span>';
    }
    
    selectedTags.innerHTML = allPrompts.slice(-20).map(p => `
        <span class="selected-tag">
            ${p.cn}
            <span class="remove" onclick="removeTag('${p.cn}')">×</span>
        </span>
    `).join('');
    
    resultStats.textContent = `已选择: ${allPrompts.length} 个提示词${customInput ? ' + 自定义' : ''}${includeNegative && negativeInput ? ' + 负面提示词' : ''}`;
}

function removeTag(cn) {
    const removedPrompt = selectedPrompts.find(p => p.cn === cn);
    selectedPrompts = selectedPrompts.filter(p => p.cn !== cn);
    
    // 找到对应的tab并更新badge
    document.querySelectorAll('.prompt-tag').forEach(tag => {
        if (tag.dataset.cn === cn) {
            tag.classList.remove('selected');
            // 查找所属的tab-panel
            const tabPanel = tag.closest('.tab-panel');
            if (tabPanel) {
                const tabId = tabPanel.id;
                if (moduleSelectedCount[tabId]) {
                    moduleSelectedCount[tabId]--;
                    updateModuleBadge(tabId);
                }
            }
        }
    });
    
    // 如果"全部"Tab有此标签，也更新其计数
    if (moduleSelectedCount['tab-all'] > 0) {
        moduleSelectedCount['tab-all']--;
        updateModuleBadge('tab-all');
    }
    
    updateResult();
}

function setCopyMode(mode) {
    copyMode = mode;
    document.querySelectorAll('.copy-mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === mode);
    });
    updateResult();
}

function copyPrompt() {
    const resultArea = document.getElementById('resultArea');
    const textToCopy = resultArea.textContent;
    
    if (!textToCopy || textToCopy.includes('请从左侧选择提示词')) {
        showToast('请先选择提示词！');
        return;
    }
    
    navigator.clipboard.writeText(textToCopy).then(() => {
        showToast('已复制到剪贴板!');
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = textToCopy;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('已复制到剪贴板!');
    });
}

function clearAll() {
    selectedPrompts = [];
    document.querySelectorAll('.prompt-tag.selected').forEach(tag => {
        tag.classList.remove('selected');
    });
    
    // 清除脚手架选中状态
    document.querySelectorAll('.scaffold-card.selected').forEach(card => {
        card.classList.remove('selected');
    });
    selectedScaffoldIndex = -1;
    
    // 重置所有模块的badge
    Object.keys(moduleSelectedCount).forEach(tabId => {
        moduleSelectedCount[tabId] = 0;
        updateModuleBadge(tabId);
    });
    
    // 重置所有模块的选中计数徽章
    document.querySelectorAll('.module-count-selected').forEach(badge => {
        badge.textContent = '';
        badge.classList.remove('has-selected');
    });
    
    // 更新筛选导航栏二级选项的选中计数
    updateLevel2Counts();
    
    document.getElementById('customInput').value = '';
    document.getElementById('negativeInput').value = '';
    document.getElementById('includeNegative').checked = false;
    updateResult();
    showToast('已清空所有选择');
}

function showToast(message) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
}

function filterPrompts() {
    const searchInput = document.getElementById('searchInput').value.toLowerCase();
    const hasSearch = searchInput.length > 0;
    
    // 搜索普通提示词标签
    document.querySelectorAll('.prompt-tag').forEach(tag => {
        const cn = tag.dataset.cn.toLowerCase();
        const en = tag.dataset.en.toLowerCase();
        const match = cn.includes(searchInput) || en.includes(searchInput);
        tag.classList.toggle('hidden', !match);
    });
    
    // 搜索脚手架卡片
    document.querySelectorAll('.scaffold-card').forEach(card => {
        const title = card.querySelector('.scaffold-card-title');
        const tags = card.querySelectorAll('.scaffold-tag');
        const img = card.querySelector('.scaffold-card-image');
        let cardText = title ? title.textContent.toLowerCase() : '';
        if (img) cardText += ' ' + (img.alt || '').toLowerCase();
        tags.forEach(tag => {
            cardText += ' ' + tag.textContent.toLowerCase();
        });
        const match = cardText.includes(searchInput);
        card.classList.toggle('hidden', !match);
    });
    
    // 更新模块显示状态
    document.querySelectorAll('.module').forEach(module => {
        const visibleTags = module.querySelectorAll('.prompt-tag:not(.hidden)');
        const visibleCards = module.querySelectorAll('.scaffold-card:not(.hidden)');
        module.style.display = (visibleTags.length > 0 || visibleCards.length > 0) ? '' : 'none';
    });
    
    // 更新tab按钮状态 - 如果搜索框有内容，显示所有tab
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.style.display = hasSearch ? 'flex' : '';
    });
    
    // 如果搜索为空，恢复所有模块的显示
    if (!hasSearch) {
        document.querySelectorAll('.module').forEach(module => {
            module.style.display = '';
        });
    }
}


function openSaveModal() {
    const resultArea = document.getElementById('resultArea');
    const text = resultArea.textContent;
    if (!text || text.includes('请从左侧选择提示词')) {
        showToast('请先组合提示词再保存！');
        return;
    }
    document.getElementById('templateName').value = '';
    document.getElementById('templateDesc').value = '';
    document.getElementById('templateImage').value = '';
    document.getElementById('templateImagePreview').innerHTML = '';
    document.getElementById('templateImagePreview').classList.remove('show');
    document.getElementById('saveModal').classList.add('show');
    setTimeout(() => document.getElementById('templateName').focus(), 100);
}

function closeSaveModal() {
    document.getElementById('saveModal').classList.remove('show');
}

function previewTemplateImage() {
    const url = document.getElementById('templateImage').value.trim();
    const preview = document.getElementById('templateImagePreview');
    if (url) {
        preview.innerHTML = `<img src="${url}" onerror="this.parentElement.innerHTML='<span style=\\'color:#ff6b6b;font-size:0.82em\\'>图片加载失败</span>'">`;
        preview.classList.add('show');
    } else {
        preview.innerHTML = '';
        preview.classList.remove('show');
    }
}

function saveTemplate() {
    const name = document.getElementById('templateName').value.trim();
    if (!name) {
        showToast('请输入模板名称！');
        document.getElementById('templateName').focus();
        return;
    }

    const allPrompts = [...selectedPrompts];
    if (allPrompts.length === 0) {
        showToast('当前没有选中的提示词！');
        return;
    }

    const cnText = allPrompts.map(p => p.cn).join('，');
    const enText = allPrompts.map(p => p.en).join(', ');
    const imageUrl = document.getElementById('templateImage').value.trim();
    const description = document.getElementById('templateDesc').value.trim();

    // 检查是否重名
    if (userTemplates.some(t => t.name === name)) {
        showToast('模板名称已存在！');
        return;
    }

    userTemplates.push({ name, cn: cnText, en: enText, imageUrl, description });
    saveUserTemplates();
    closeSaveModal();
    // 重新渲染以显示新模板
    renderModules();
    showToast(`模板「${name}」已保存到快捷脚手架`);
}

function initApp() {
    try {
        const yamlData = document.getElementById('yamlData');
        if (!yamlData || !yamlData.textContent.trim()) {
            throw new Error('YAML data not found in page');
        }
        promptData = jsyaml.load(yamlData.textContent);
        renderModules();
        
        // 初始化多行筛选导航组件
        renderFilterNav();
    } catch (e) {
        console.error('Failed to load prompt data:', e);
        document.getElementById('resultArea').innerHTML = '<span class="result-empty" style="color:#ff5050">⚠️ 加载提示词数据失败</span>';
    }
}

initApp();
document.getElementById('searchInput').addEventListener('input', filterPrompts);
document.getElementById('customInput').addEventListener('input', updateResult);
document.getElementById('negativeInput').addEventListener('input', updateResult);
document.getElementById('includeNegative').addEventListener('change', updateResult);
</script>
</body>
